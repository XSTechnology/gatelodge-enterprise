[project]
name = "gatelodge"
version = "2.3.0"
description = "Gatelodge — local OpenAI-compatible LLM gateway: embedded llama.cpp + cloud backends, JSON-convention tool calling, GPU placement"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "huggingface-hub>=1.32.0",
    "keyring>=25.7.0",
    "llama-cpp-python",
    "openai>=1.60",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "nuitka>=4.3",
    "ordered-set>=4.1.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "zen-engine>=2.1.3",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
# Windows dev box: prebuilt CUDA wheel; other platforms (the Docker
# image skips it entirely via --no-install-package) resolve from PyPI.
llama-cpp-python = [
  { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.35-cu132/llama_cpp_python-0.3.35-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" },
]
