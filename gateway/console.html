<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f12">
<title>Gatelodge Admin</title>
<style>
:root {
  --bg: #f0f2f5; --bg-deep: #e8ebf0; --card: #ffffff; --card-hover: #f5f7fa;
  --border: #d0d5dd; --text: #1a1a2e; --text-dim: #555; --text-faint: #888;
  --primary: #2563eb; --primary-soft: rgba(37,99,235,.1);
  --warning: #d97706; --danger: #dc2626; --success: #16a34a;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,.08);
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh; padding:20px;
  background-image:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(37,99,235,.05),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(37,99,235,.03),transparent);
  background-attachment:fixed; -webkit-font-smoothing:antialiased; }
.header { display:flex; align-items:center; gap:10px; margin-bottom:8px; max-width:860px; margin-left:auto; margin-right:auto; }
.header h1 { font-size:1.3rem; font-weight:600; color:var(--primary); }
.header .spacer { flex:1; }
#conn { font-size:.78rem; color:var(--text-faint); }
#conn.ok { color:var(--success); } #conn.bad { color:var(--danger); }
#key { padding:6px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card); color:var(--text); font-size:.82rem; width:180px; font-family:inherit; }
#key:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
.subheader { max-width:860px; margin:0 auto 16px; font-size:.8rem; color:var(--text-dim);
  display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
.subheader b { color:var(--text); }
.settings-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; max-width:860px; margin:0 auto; }
.cat-btn { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px;
  border:1px solid var(--border); background:var(--card); color:var(--text-dim); font-size:.8rem;
  font-weight:500; cursor:pointer; border-radius:var(--radius); transition:var(--transition);
  font-family:inherit; text-align:center; }
.cat-btn:hover { color:var(--text); background:var(--primary-soft); border-color:var(--primary); transform:translateY(-1px); }
.cat-btn:active { transform:scale(.97); }
.cat-btn .cat-icon { font-size:1.6rem; line-height:1; }
.cat-btn.dashed { border-style:dashed; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:2000; padding:20px; }
.modal-overlay.show { display:flex; animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background:var(--card); border-radius:var(--radius); padding:24px; width:100%; max-width:860px;
  box-shadow:var(--shadow); border:1px solid var(--border); max-height:90vh; overflow-y:auto;
  scrollbar-width:thin; }
.modal::-webkit-scrollbar { width:6px; } .modal::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.modal-title { font-size:1.2rem; font-weight:600; margin-bottom:14px; color:var(--primary); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
.btn { padding:8px 20px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:.9rem;
  cursor:pointer; font-family:inherit; background:var(--card); color:var(--text); transition:var(--transition); }
.btn:hover { border-color:var(--primary); color:var(--primary); }
.btn:active { transform:scale(.97); }
.btn-sm { padding:4px 12px; font-size:.78rem; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { filter:brightness(1.1); color:#fff; }
.btn-danger:hover { border-color:var(--danger); color:var(--danger); }
table { width:100%; border-collapse:collapse; font-size:.82rem; }
th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--bg-deep); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:260px; }
th { color:var(--text-faint); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
td.num, th.num { text-align:right; }
.badge { display:inline-block; font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:6px;
  color:#fff; vertical-align:middle; }
.badge.embedded { background:#2e7d32; } .badge.llama-server { background:#1565c0; }
.badge.runpod { background:#7b1fa2; } .badge.runpod-public { background:#6a1b9a; } .badge.openai { background:#e65100; }
.badge.ok { background:var(--success); } .badge.warn { background:var(--warning); }
.badge.err { background:var(--danger); } .badge.dim { background:#9e9e9e; }
.widget { padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:12px; }
.widget h3 { font-size:.85rem; margin-bottom:8px; color:var(--text); }
.bar { height:18px; background:var(--border); border-radius:9px; overflow:hidden; }
.bar-fill { height:100%; width:0%; border-radius:9px; background:linear-gradient(90deg,#4CAF50,#66BB6A); transition:width .5s; }
.bar-fill.warn { background:linear-gradient(90deg,#FFA726,#FB8C00); }
.bar-fill.err { background:linear-gradient(90deg,#EF5350,#E53935); }
.logs { max-height:56vh; overflow-y:auto; font-family:'Cascadia Code',Consolas,monospace; font-size:.78rem;
  line-height:1.5; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; }
.log-entry { padding:1px 0; } .log-time { color:var(--text-faint); }
.log-level { font-weight:600; }
.log-level.INFO { color:var(--text-dim); } .log-level.WARNING { color:var(--warning); }
.log-level.ERROR { color:var(--danger); } .log-msg { color:var(--text); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.chip { border:1px solid var(--border); border-radius:999px; padding:3px 12px; font-size:.75rem;
  display:inline-flex; gap:8px; align-items:center; background:var(--card); }
.chip .muted { color:var(--text-faint); font-size:.68rem; }
.chip button { border:none; background:none; cursor:pointer; color:var(--primary); font-size:.72rem; padding:0; font-family:inherit; }
.chip button:hover { text-decoration:underline; }
.srow { display:flex; align-items:center; gap:8px; margin-bottom:6px; padding:4px 0; flex-wrap:wrap; }
.srow label { flex:1; font-size:.85rem; color:var(--text-dim); min-width:140px; }
.srow input, .srow select { width:220px; padding:6px 10px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-size:.85rem; font-family:inherit; }
.srow input:focus, .srow select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
.srow .info-value { font-size:.82rem; color:var(--text-faint); font-style:italic; }
#cfg-raw { width:100%; height:260px; font:12px/1.4 Consolas,monospace; white-space:pre; resize:vertical;
  border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); padding:10px; }
.notif { position:fixed; top:20px; right:20px; z-index:3000; background:var(--success); color:#000;
  padding:10px 16px; border-radius:var(--radius-sm); font-size:.85rem; font-weight:600;
  box-shadow:var(--shadow); animation:slideIn .3s ease; max-width:350px; }
.notif.error { background:var(--danger); color:#fff; }
@keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
.loading { text-align:center; padding:40px; color:var(--text-faint); font-size:.9rem; }
.svc-card { border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; background:var(--bg); }
.svc-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.svc-head b { font-size:.95rem; }
.svc-params { font-size:.75rem; color:var(--text-dim); margin-bottom:6px; font-family:Consolas,monospace; }
.svc-models { font-size:.78rem; color:var(--text-dim); }
.kv { font-size:.78rem; color:var(--text-dim); margin:2px 0; }
.kv b { color:var(--text); font-weight:600; }
.muted { color:var(--text-faint); font-size:.75rem; }
.dw-tagline { font-size:.75rem; color:var(--text-faint); margin:-2px 0 8px 148px; min-height:1em; }
.dw-cost { font-size:1.1rem; font-weight:600; margin:12px 0 2px; }
.dw-vram-ok { color:var(--success); } .dw-vram-low { color:var(--warning); }
label.dw-radio { display:inline-flex; align-items:center; gap:4px; flex:0 0 auto; min-width:0;
  font-size:.85rem; color:var(--text-dim); cursor:pointer; margin-right:12px; }
.dw-msg { margin-top:10px; border-radius:var(--radius-sm); padding:10px 12px; font-size:.85rem; overflow-wrap:anywhere; }
.dw-msg.err { background:rgba(220,38,38,.08); border:1px solid var(--danger); }
.dw-msg.ok { background:rgba(22,163,74,.08); border:1px solid var(--success); }
.dw-msg ul { margin:6px 0 0 18px; }
.dw-msg code { font-family:Consolas,monospace; font-size:.8rem; background:var(--bg-deep); padding:1px 5px; border-radius:4px; }
.dw-hint { font-size:.75rem; color:var(--text-faint); margin-top:6px; }
/* boot watch modal */
.bw-overlay { position:fixed; inset:0; background:rgba(15,15,18,.55); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:2500; padding:20px; }
.bw-overlay.show { display:flex; animation:fadeIn .2s ease; }
.bw-panel { background:var(--card); border-radius:var(--radius); border:1px solid var(--border);
  box-shadow:var(--shadow); width:100%; max-width:700px; max-height:92vh; overflow-y:auto;
  padding:18px 20px; scrollbar-width:thin; }
.bw-head { display:flex; align-items:flex-start; gap:10px; }
.bw-head h2 { font-size:1.05rem; font-weight:600; color:var(--primary); flex:1; min-width:0; margin:0; }
.bw-podline { font-size:.74rem; color:var(--text-faint); margin:2px 0 0; }
.bw-podline code { font-family:Consolas,monospace; }
.bw-close { border:none; background:none; font-size:1.15rem; cursor:pointer; color:var(--text-faint);
  line-height:1; padding:2px 8px; border-radius:var(--radius-sm); font-family:inherit; flex:0 0 auto; }
.bw-close:hover { color:var(--danger); background:var(--bg); }
.bw-statusrow { display:flex; align-items:center; gap:10px; margin:12px 0; flex-wrap:wrap; }
.bw-state { display:inline-block; font-size:.75rem; font-weight:600; padding:4px 12px; border-radius:999px;
  background:var(--primary-soft); color:var(--primary); }
.bw-state.warm { background:rgba(217,119,6,.12); color:var(--warning); }
.bw-state.err { background:rgba(220,38,38,.10); color:var(--danger); }
.bw-state.ok { background:rgba(22,163,74,.12); color:var(--success); }
.bw-elapsed { font-size:.78rem; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.bw-logs { background:#111; border:1px solid var(--border); border-radius:var(--radius-sm); height:300px;
  overflow-y:auto; padding:10px 12px; font-family:'Cascadia Code',Consolas,monospace; font-size:.73rem;
  line-height:1.55; scrollbar-width:thin; }
.bw-log { color:#c9d1d9; white-space:pre-wrap; word-break:break-word; }
.bw-log .bw-ts { color:#6e7681; margin-right:8px; }
.bw-log.bw-mark { color:#79c0ff; font-weight:600; }
.bw-waiting { color:#6e7681; font-style:italic; }
.bw-banner { margin-top:12px; border-radius:var(--radius-sm); padding:12px 14px; font-size:.88rem; }
.bw-banner.ok { background:rgba(22,163,74,.08); border:1px solid var(--success); }
.bw-banner.warn { background:rgba(217,119,6,.08); border:1px solid var(--warning); }
.bw-banner .bw-sub { margin-top:6px; font-size:.76rem; color:var(--text-dim); word-break:break-all; }
.bw-banner code { font-family:Consolas,monospace; font-size:.76rem; }
/* v3 pod lifecycle: alerts + rules */
.btn-danger-solid { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn-danger-solid:hover { filter:brightness(1.12); color:#fff; }
.lc-alert { border-radius:var(--radius-sm); padding:8px 12px; margin-bottom:6px; font-size:.82rem; overflow-wrap:anywhere; }
.lc-alert.critical { background:rgba(220,38,38,.08); border:1px solid var(--danger); }
.lc-alert.warn { background:rgba(217,119,6,.08); border:1px solid var(--warning); }
.lc-alert.info { background:var(--card); border:1px solid var(--border); }
.lc-in { width:90px; padding:4px 8px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card); color:var(--text); font-size:.82rem; font-family:inherit; }
.lc-in:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
select.lc-in { width:auto; padding-right:4px; }
.lc-budgetbar { margin:6px 0 2px; max-width:340px; }
/* v4 model finder */
.fm-chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; }
.fm-chip { border:1px solid var(--border); border-radius:999px; padding:4px 14px; font-size:.78rem;
  background:var(--card); color:var(--text-dim); cursor:pointer; font-family:inherit; transition:var(--transition); }
.fm-chip:hover { border-color:var(--primary); color:var(--primary); }
.fm-chip.active { background:var(--primary); border-color:var(--primary); color:#fff; }
.fm-chip.active:hover { color:#fff; filter:brightness(1.08); }
.fm-group { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
  color:var(--text-faint); margin:10px 0 6px; }
.fm-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:7px 10px;
  border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--card);
  margin-bottom:6px; cursor:pointer; transition:var(--transition); font-family:inherit;
  font-size:.85rem; color:var(--text); text-align:left; width:100%; }
.fm-row:hover { border-color:var(--primary); background:var(--primary-soft); }
.fm-row:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
.fm-name { font-weight:600; overflow-wrap:anywhere; }
.fm-src { font-size:.64rem; font-weight:700; padding:2px 6px; border-radius:5px; flex:0 0 auto; }
.fm-src.hf { background:#ffd21e; color:#111; }
.fm-src.ms { background:#1667d9; color:#fff; }
.fm-src.oll { background:#3a3f4b; color:#fff; }
.fm-cap { display:inline-block; font-size:.66rem; font-weight:600; padding:1px 7px; border-radius:5px; }
.fm-cap.solid { background:var(--primary-soft); color:var(--primary); }
.fm-cap.dim { border:1px solid var(--border); color:var(--text-faint); }
.fm-expert-box { border-top:1px dashed var(--border); margin-top:12px; padding-top:10px; }
@media (max-width:600px){ body{padding:12px} .settings-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .cat-btn{padding:12px 6px;font-size:.75rem} .modal{padding:16px}
  .bw-panel{padding:14px} .bw-logs{height:240px} }
</style>
</head>
<body>

<div class="header">
  <h1>🧠 Gatelodge Admin</h1>
  <span class="spacer"></span>
  <span id="conn">connecting…</span>
  <input id="key" type="password" placeholder="API key (blank = open)" style="display:none">
</div>
<div class="subheader" id="subheader">
  <span id="sh-version"></span> <span id="sh-backends"></span>
  <span id="sh-models"></span> <span id="sh-gpus"></span>
</div>

<div class="settings-grid" id="grid">
  <button class="cat-btn" onclick="showPanel('models')" title="Loaded instances, worker pools, on-disk GGUFs, load/unload">
    <span class="cat-icon">🧠</span><span>Models</span></button>
  <button class="cat-btn" onclick="showPanel('services')" title="Backend service definitions: connection params, models, live children & pods">
    <span class="cat-icon">🔌</span><span>Services</span></button>
  <button class="cat-btn" onclick="showPanel('cloud')" title="GPU cloud providers: deploy wizard, volumes, spend, live pods (RunPod)">
    <span class="cat-icon">☁</span><span>Cloud</span></button>
  <button class="cat-btn" onclick="showPanel('perf')" title="GPU memory, per-model latency/token stats, recent requests">
    <span class="cat-icon">📊</span><span>Performance</span></button>
  <button class="cat-btn dashed" onclick="showPanel('syslog')" title="Live gateway log events">
    <span class="cat-icon">📋</span><span>Syslog</span></button>
  <button class="cat-btn" onclick="showPanel('params')" title="Port, bind, queue, models_dir, gateway keys + raw config JSON">
    <span class="cat-icon">⚙️</span><span>Parameters</span></button>
  <button class="cat-btn" onclick="showPanel('keys')" title="API key status per backend (env / keyring / missing)">
    <span class="cat-icon">🔑</span><span>API Keys</span></button>
  <button class="cat-btn" onclick="showPanel('health')" title="Health overview + recovery: stop children, stop pods, unload all, reload config">
    <span class="cat-icon">🩺</span><span>Health &amp; Recovery</span></button>
  <button class="cat-btn" onclick="showPanel('aliases')" title="Alias chains with hedge racing">
    <span class="cat-icon">🧭</span><span>Aliases</span></button>
  <button class="cat-btn" onclick="showPanel('governance')" title="Guardrails, smart routes, batch jobs, eval reports">
    <span class="cat-icon">🛡️</span><span>Governance</span></button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<div class="bw-overlay" id="bw-overlay">
  <div class="bw-panel" role="dialog" aria-modal="true" aria-labelledby="bw-title">
    <div class="bw-head">
      <h2 id="bw-title">🚀 Spinning up…</h2>
      <button class="bw-close" onclick="bwClose()" title="Close (polling stops — the pod keeps booting)" aria-label="Close boot watch">✕</button>
    </div>
    <div class="bw-podline" id="bw-podline"></div>
    <div class="bw-statusrow">
      <span class="bw-state" id="bw-state">⏳ starting pod…</span>
      <span class="bw-elapsed" id="bw-elapsed">⏱ 0s</span>
    </div>
    <div class="bw-logs" id="bw-logs" aria-label="Container log tail">
      <div class="bw-waiting">waiting for pod logs…</div>
    </div>
    <div id="bw-banner"></div>
  </div>
</div>

<script>
'use strict';
var KEY = localStorage.getItem('gw_key') || '';
var _syslogTimer = null, _perfTimer = null, _bwTimer = null, _lcTimer = null;

// ---------- api ----------
function api(path, opts) {
  opts = opts || {};
  var headers = opts.headers || {};
  headers['Content-Type'] = 'application/json';
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  return fetch(path, {method: opts.method || 'GET', headers: headers,
                      body: opts.body ? JSON.stringify(opts.body) : undefined})
    .then(function (r) {
      if (r.status === 401) { setConn('bad', '401 — wrong API key'); throw new Error('401 unauthorized'); }
      if (!r.ok) return r.json().then(function (b) {
        throw new Error((b && b.error && b.error.message) || ('HTTP ' + r.status));
      });
      return r.json();
    });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setConn(cls, txt) { var el = document.getElementById('conn');
  el.className = cls || ''; el.textContent = txt; }
function notify(msg, isErr) {
  var d = document.createElement('div');
  d.className = 'notif' + (isErr ? ' error' : '');
  d.textContent = msg; document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 3200);
}
function fmtMB(mb) { return mb >= 1024 ? (mb/1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB'; }

// ---------- boot ----------
function boot() {
  var keyEl = document.getElementById('key');
  keyEl.style.display = '';
  keyEl.value = KEY;
  keyEl.addEventListener('change', function () {
    KEY = keyEl.value.trim(); localStorage.setItem('gw_key', KEY); refreshHeader();
  });
  refreshHeader();
  setInterval(refreshHeader, 15000);
}
function refreshHeader() {
  api('/healthz').then(function (h) {
    setConn('ok', '● connected');
    document.getElementById('sh-version').innerHTML = '<b>' + esc(h.version) + '</b>';
    var types = Object.keys(h.backends || {}).map(function (n) {
      return '<span class="badge ' + esc(h.backends[n].type) + '">' + esc(n) + '</span>'; }).join(' ');
    document.getElementById('sh-backends').innerHTML = types;
    document.getElementById('sh-models').textContent =
      h.loaded_count + ' loaded · ' + h.discovered_models + ' on disk';
    var g = (h.gpus || [])[0];
    document.getElementById('sh-gpus').textContent = g
      ? (g.name + ' · ' + fmtMB(g.free_mb) + ' free') : '';
  }).catch(function (e) { setConn('bad', '✗ ' + e.message); });
}

// ---------- modal ----------
function showPanel(name) {
  document.getElementById('modal').classList.add('show');
  stopTimers();
  var t = document.getElementById('modal-title'), b = document.getElementById('modal-body');
  b.innerHTML = '<div class="loading">Loading…</div>';
  ({models: showModels, services: showServices, cloud: showCloud, perf: showPerf,
    syslog: showSyslog, params: showParams, keys: showKeys,
    health: showHealth, aliases: showAliases,
    governance: showGovernance}[name] || function(){})(
      {title: t, body: b});
}
function closeModal() {
  document.getElementById('modal').classList.remove('show'); stopTimers();
}
function stopTimers() {
  if (_syslogTimer) { clearInterval(_syslogTimer); _syslogTimer = null; }
  if (_perfTimer) { clearInterval(_perfTimer); _perfTimer = null; }
  if (_bwTimer) { clearInterval(_bwTimer); _bwTimer = null; }
  if (_lcTimer) { clearInterval(_lcTimer); _lcTimer = null; }
}

var _editModelName = null; // tracks which model we're editing
function showModels(ui) {

  Promise.all([api('/admin/models'), api('/admin/backends')]).then(function (r) {

function buildConfiguredTable(configured, data) {
  var names = Object.keys(configured);
  var html = '<div class="widget"><h3>Configured models (' + names.length + ')</h3>';
  if (!names.length) {
    html += '<div class="muted">No models configured — add one above or use auto-discovery.</div>';
  } else {
    html += '<table><thead><tr><th>name</th><th>backend</th><th>role</th><th>details</th><th></th></tr></thead><tbody>';
    names.forEach(function (n) {
      var info = configured[n];
      var cfg = info.cfg || {};
      var details = [];
      if (cfg.gguf) details.push('file: ' + esc(cfg.gguf));
      if (cfg.remote_id) details.push('remote: ' + esc(cfg.remote_id));
      if (cfg.endpoint_id) details.push('ep: ' + esc(cfg.endpoint_id));
      if (cfg.pod_id) details.push('pod: ' + esc(cfg.pod_id));
      if (cfg.ctx) details.push('ctx: ' + cfg.ctx);
      if (cfg.workers && cfg.workers > 1) details.push('×' + cfg.workers + ' workers');
      if (cfg.parallel && cfg.parallel > 1) details.push('×' + cfg.parallel + ' slots');
      if (cfg.placement) details.push('GPU: ' + esc(cfg.placement));
      if (cfg.transport) details.push(cfg.transport);
      if (cfg.model_slug) details.push('slug: ' + esc(cfg.model_slug));
      if (cfg.timeout_s) details.push('timeout: ' + cfg.timeout_s + 's');
      // Check if loaded
      var loaded = (data.loaded || []).find(function (m) { return m.alias === n; });
      var statusBadge = loaded ? '<span class="badge ok">loaded</span>' : '<span class="badge dim">not loaded</span>';
      html += '<tr><td><b>' + esc(n) + '</b> ' + statusBadge + '</td>' +
        '<td><span class="badge ' + esc(info.btype) + '">' + esc(info.backend) + '</span></td>' +
        '<td>' + esc(info.role) + '</td>' +
        '<td class="muted">' + (details.length ? details.join(' · ') : '—') + '</td>' +
        '<td><button class="btn btn-sm" onclick="editModel(\'' + esc(n) + '\',\'' + esc(info.backend) + '\',\'' + esc(info.role) + '\')">edit</button> ' +
        '<button class="btn btn-sm btn-danger" onclick="deleteModel(\'' + esc(n) + '\',\'' + esc(info.backend) + '\',\'' + esc(info.role) + '\')">delete</button></td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

function buildLoadedTable(loaded) {

  if (!loaded.length) html += '<div class="muted">Nothing resident — models load lazily on first request.</div>';

        '<td class="num">' + m.n_ctx + '</td><td class="num">' + esc(m.size_vram_human) + '</td>' +

function loadCatalog() {
  var backend = document.getElementById('cat-backend').value;
  document.getElementById('cat-status').textContent = 'Loading catalog…';
  _catalogModels = null;
  renderCatalog();
  api('/admin/backends/' + encodeURIComponent(backend) + '/remote-models')
    .then(function (d) {
      _catalogModels = d.models || [];
      document.getElementById('cat-status').textContent =
        d.count + ' models from ' + (d.base_url || backend) +
        ' — click ＋ to prefill the Add-model form above.';
      renderCatalog();
    })
    .catch(function (e) {
      _catalogModels = null;
      document.getElementById('cat-status').textContent = '✗ ' + e.message;
      renderCatalog();
    });
}

function renderCatalog() {
  var list = document.getElementById('cat-list');
  if (!list) return;
  if (_catalogModels == null) { list.innerHTML = ''; return; }
  var q = (document.getElementById('cat-filter').value || '').toLowerCase();
  var rows = _catalogModels.filter(function (m) {
    return !q || String(m.id || '').toLowerCase().indexOf(q) >= 0;
  }).slice(0, 200);
  var html = '<table><thead><tr><th>model id</th><th>details</th><th></th></tr></thead><tbody>';
  rows.forEach(function (m) {
    var extra = [];
    if (m.owned_by) extra.push(esc(m.owned_by));
    // HF router passes pricing/latency/throughput metadata through —
    // show a compact hint of whatever is present
    ['context_length', 'pricing', 'providers', 'throughput', 'latency'].forEach(function (k) {
      if (m[k] != null) {
        try { extra.push(esc(k) + ': ' + esc(JSON.stringify(m[k]).slice(0, 70))); }
        catch (err) { /* skip unparsable metadata */ }
      }
    });
    html += '<tr><td style="white-space:nowrap">' + esc(m.id) + '</td>' +
      '<td class="muted" style="font-size:0.72rem;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
      (extra.join(' · ') || '—') + '</td>' +
      '<td><button class="btn" style="padding:2px 8px;font-size:0.75rem;" ' +
      'onclick="pickCatalogModel(\'' + esc(String(m.id)) + '\')">＋ Add</button></td></tr>';
  });
  if (!rows.length) html += '<tr><td colspan="3" class="muted">no matches</td></tr>';
  html += '</tbody></table>';
  if (_catalogModels.length > 200) {
    html += '<div class="muted">showing 200 of ' + _catalogModels.length +
      ' — use the filter</div>';
  }
  list.innerHTML = html;
}

function pickCatalogModel(id) {
  var backend = document.getElementById('cat-backend').value;
  var suffix = document.getElementById('cat-suffix').value || '';
  // Prefill the Add / Edit model form (rendered above the catalog):
  // select the backend first so its dynamic fields exist, then fill.
  document.getElementById('m-backend').value = backend;
  document.getElementById('m-role').value = 'chat';
  onBackendChange();
  document.getElementById('m-name').value =
    String(id).toLowerCase().split('/').pop()
      .replace(/[^a-z0-9._-]/g, '').slice(0, 40);
  var rid = document.getElementById('m-remote_id');
  if (rid) { rid.value = id + suffix; rid.focus(); }
  notify('Prefilled — review and Save');
}

// ---------- Try it ----------
function buildTryItWidget(configured) {
  var chatModels = [];
  Object.keys(configured || {}).forEach(function (n) {
    var c = configured[n];
    if (c.role === 'chat') {
      chatModels.push({id: c.backend + ':' + n});
    }
  });
  if (!chatModels.length) return '';
  var html = '<div class="widget"><h3>🧪 Try it</h3>';
  html += '<div class="srow"><label>Model</label><select id="try-model">';
  chatModels.forEach(function (m) {
    html += '<option value="' + esc(m.id) + '">' + esc(m.id) + '</option>';
  });
  html += '</select></div>';
  html += '<div class="srow"><label>Prompt</label><input id="try-prompt" placeholder="Ask something…" style="flex:1;min-width:260px" onkeydown="if(event.key===\'Enter\')tryIt()"></div>';
  html += '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;">' +
    '<button class="btn btn-primary" onclick="tryIt()">⚡ Send</button>' +
    '<span id="try-status" class="muted"></span></div>';
  html += '<div id="try-out" style="margin-top:8px;"></div>';
  html += '<div class="muted" style="margin-top:6px">One live round-trip through the gateway (a per-request nonce defeats the response cache).</div>';
  html += '</div>';
  return html;
}

function tryIt() {
  var model = document.getElementById('try-model').value;
  var prompt = (document.getElementById('try-prompt').value || '').trim();
  var status = document.getElementById('try-status');
  var out = document.getElementById('try-out');
  if (!prompt) { status.textContent = 'type a prompt first'; return; }
  status.textContent = 'sending…';
  out.innerHTML = '';
  var t0 = Date.now();
  var nonce = Date.now();
  api('/v1/chat/completions', {method: 'POST', body: {
    model: model,
    messages: [{role: 'user', content: prompt + ' (request id ' + nonce + ')'}]
  }}).then(function (d) {
    var ms = Date.now() - t0;
    var text = (((d.choices || [])[0] || {}).message || {}).content || '(no content)';
    var tok = ((d.usage || {}).total_tokens) || 0;
    var sb = d.served_by || {};
    status.textContent = '✓ ' + ms + 'ms';
    out.innerHTML = '<div class="muted" style="font-size:0.75rem;margin-bottom:4px">' +
      'answered by ' + esc((sb.backend || '?') + ':' + (sb.model || '?')) +
      ' · ' + tok + ' tokens</div>' +
      '<div style="white-space:pre-wrap;">' + esc(text) + '</div>';
  }).catch(function (e) {
    status.textContent = '✗ ' + e.message;
    out.innerHTML = '';
  });
}

// Store backend info for form rendering
var _modelBackends = {};
var _configuredModels = {}; // name -> {backend, role, cfg, btype, bmode}

// ---------- Model CRUD actions ----------
function saveModel() {
  var name = document.getElementById('m-name').value.trim();
  var backend = document.getElementById('m-backend').value;
  var role = document.getElementById('m-role').value;
  if (!name) { notify('✗ Name is required', true); return; }
  var payload = {name: name, backend: backend, role: role};
  // Get backend info
  var binfo = (_modelBackends || {})[backend] || {};
  var btype = binfo.type || '';
  var bmode = binfo.mode || '';
  if (role === 'embed') {
    var gguf = document.getElementById('m-gguf');
    if (gguf) payload.gguf = gguf.value.trim();
    var ctx = document.getElementById('m-ctx');
    if (ctx && ctx.value) payload.ctx = parseInt(ctx.value);
  } else if (btype === 'embedded') {
    var gguf = document.getElementById('m-gguf');
    if (gguf) payload.gguf = gguf.value.trim();
    var ctx = document.getElementById('m-ctx');
    if (ctx && ctx.value) payload.ctx = parseInt(ctx.value);
    var placement = document.getElementById('m-placement');
    if (placement && placement.value) payload.placement = placement.value;
    var workers = document.getElementById('m-workers');
    if (workers && workers.value) payload.workers = parseInt(workers.value);
  } else if (btype === 'llama-server' && bmode === 'remote') {
    var remote_id = document.getElementById('m-remote_id');
    if (remote_id) payload.remote_id = remote_id.value.trim();
  } else if (btype === 'llama-server') {
    var gguf = document.getElementById('m-gguf');
    if (gguf) payload.gguf = gguf.value.trim();
    var ctx = document.getElementById('m-ctx');
    if (ctx && ctx.value) payload.ctx = parseInt(ctx.value);
    var placement = document.getElementById('m-placement');
    if (placement && placement.value) payload.placement = placement.value;
    var parallel = document.getElementById('m-parallel');
    if (parallel && parallel.value) payload.parallel = parseInt(parallel.value);
  } else if (btype === 'runpod') {
    var endpoint_id = document.getElementById('m-endpoint_id');
    if (endpoint_id) payload.endpoint_id = endpoint_id.value.trim();
    var transport = document.getElementById('m-transport');
    if (transport) payload.transport = transport.value;
    var timeout_s = document.getElementById('m-timeout_s');
    if (timeout_s && timeout_s.value) payload.timeout_s = parseInt(timeout_s.value);
    var pod_id = document.getElementById('m-pod_id');
    if (pod_id) payload.pod_id = pod_id.value.trim();
  } else if (btype === 'openai') {
    var remote_id = document.getElementById('m-remote_id');
    if (remote_id) payload.remote_id = remote_id.value.trim();
  } else if (btype === 'runpod-public') {
    var model_slug = document.getElementById('m-model_slug');
    if (model_slug) payload.model_slug = model_slug.value.trim();

function buildRunpodServers() {

    'start resumes a stopped pod (keeps storage) · stop idles it · terminate frees everything · ' +

function refreshRunpodPods() {
  var box = document.getElementById('rp-pods-body');
  if (!box) return;
  box.innerHTML = '<div class="muted">loading…</div>';
  Promise.all([api('/admin/runpod/inventory', {method: 'POST'}),
               api('/healthz'), api('/admin/backends')])
    .then(function (r) {
      renderRunpodPods(r[0], r[1].runpod || [], _rpPodSpecs(r[2]));
    })
    .catch(function (e) { box.innerHTML = errBox(e); });
}
// deployable pod models from config (runpod backends, non-serverless)
function _rpPodSpecs(defs) {
  var specs = [];
  ((defs && defs.backends) || []).forEach(function (b) {
    if (b.type !== 'runpod') return;
    Object.keys(b.models || {}).forEach(function (m) {
      var spec = b.models[m] || {};
      if (spec.endpoint_id) return; // serverless — no pod
      if (!spec.pod_id && !spec.image) return; // draft entry — not deployable
      specs.push({backend: b.name, model: m, pod_id: spec.pod_id || null});
    });
  });
  return specs;
}
// gateway-managed pods are named gw-<backend>-<model> (runpod._pod_name)
function _gwPodName(backend, model) {
  return ('gw-' + backend + '-' + model).toLowerCase()
    .replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}
function _rpMatch(p, mgrs, specs) {
  for (var i = 0; i < mgrs.length; i++)
    if (mgrs[i].pod_id === p.id) return mgrs[i];
  for (var j = 0; j < specs.length; j++)
    if (specs[j].pod_id && specs[j].pod_id === p.id) return specs[j];
  for (var k = 0; k < specs.length; k++)
    if (_gwPodName(specs[k].backend, specs[k].model) === p.name) return specs[k];
  return null;
}
function _fmtDur(s) {
  if (s == null) return '—';
  s = Math.round(s);
  if (s < 90) return s + 's';
  if (s < 5400) return Math.round(s / 60) + 'm';
  return Math.floor(s / 3600) + 'h ' + Math.round((s % 3600) / 60) + 'm';
}
// v3 idle countdown for lifecycle-managed pods (healthz runpod entries):
// running + idle_stop_s armed → "auto-stop in Xm", otherwise plain idle age
function _rpIdleHtml(m) {
  if (!m || m.idle_s == null) return '';
  if (m.state === 'running' && m.idle_stop_s > 0) {
    var left = Math.max(0, Math.ceil((m.idle_stop_s - m.idle_s) / 60));
    return ' · auto-stop in ' + left + 'm';
  }
  return ' · idle ' + _fmtDur(m.idle_s);
}
function _rpStatusBadge(p, m) {
  var warm = (p.status || '') === 'warming-up' ||
    (m && (m.state === 'warming-up' || m.warming));
  if (warm) {
    var whtml = '<span class="badge warn">warming up</span>';
    if (m && m.warm_s != null) whtml += ' <span class="muted">' + Math.round(m.warm_s) + 's</span>';
    return whtml;
  }
  var st = p.status || 'UNKNOWN';
  var cls = st === 'RUNNING' ? 'ok' : (st === 'STOPPED' || st === 'EXITED') ? 'dim' : 'warn';
  var html = '<span class="badge ' + cls + '">' + esc(st) + '</span>';
  if (p.desiredStatus && p.desiredStatus !== p.status)
    html += ' <span class="muted">→ ' + esc(p.desiredStatus) + '</span>';
  return html;
}
function renderRunpodPods(inv, mgrs, specs) {
  var box = document.getElementById('rp-pods-body');
  if (!box) return;
  if (inv.error) { box.innerHTML = errBox({message: inv.error}); return; }
  var html = '<table><thead><tr><th>server</th><th>status</th><th>gpu</th><th>cost</th><th></th></tr></thead><tbody>';
  var matched = {};  // "backend:model" -> true (live pod exists)
  inv.pods.forEach(function (p) {
    var m = _rpMatch(p, mgrs, specs), running = (p.status || '') === 'RUNNING';
    var acts = p.actions || [];
    var wantStart = acts.length ? acts.indexOf('start') >= 0 : !running;
    var wantStop = acts.length ? acts.indexOf('stop') >= 0 : running;
    var label = m ? '<b>' + esc(m.backend) + ':' + esc(m.model) + '</b>' : '<b>' + esc(p.name || 'pod') + '</b>';
    if (m) { label += ' <span class="badge runpod">managed</span>'; matched[m.backend + ':' + m.model] = true; }
    label += '<div class="muted"><code>' + esc(p.id) + '</code>' + _rpIdleHtml(m) + '</div>';
    var gpu = p.gpuTypeId ? (p.gpuCount > 1 ? p.gpuCount + '× ' : '') + esc(p.gpuTypeId) : '—';
    if (p.gpuUtil != null) gpu += ' <span class="muted">' + p.gpuUtil + '%</span>';
    var cost = [];
    if (p.costPerHour) cost.push('$' + p.costPerHour + '/hr');
    if (p.costPerHour && p.uptimeSeconds != null)
      cost.push('$' + (p.uptimeSeconds / 3600 * p.costPerHour).toFixed(2) + ' session');
    var btns = '';
    if (wantStop) btns += '<button class="btn btn-sm" onclick="runpodPodAction(\'' + esc(p.id) + '\',\'stop\')">stop</button> ';
    if (wantStart) btns += '<button class="btn btn-sm" onclick="runpodPodAction(\'' + esc(p.id) + '\',\'start\')">start</button> ';
    if (!running) btns += '<button class="btn btn-sm" onclick="bwOpenFromPod(\'' +
      esc(m ? m.backend : 'rp') + '\',\'' + esc(m ? m.model : (p.name || p.id)) + '\',\'' +
      esc(p.id) + '\',\'' + esc(p.name || '') + '\')" ' +
      'title="Live boot watch: server status + container logs">📡 watch</button> ';
    if (m) btns += '<button class="btn btn-sm" onclick="testRunpodModel(\'' + esc(m.backend) + '\',\'' + esc(m.model) + '\')">⚗ test</button> ';
    btns += '<button class="btn btn-sm btn-danger" onclick="runpodPodAction(\'' + esc(p.id) + '\',\'terminate\')">terminate</button>';
    html += '<tr><td>' + label + '</td><td>' + _rpStatusBadge(p, m) + '</td>' +
      '<td class="muted">' + gpu + '</td>' +
      '<td class="muted">' + (cost.length ? cost.join('<br>') : '—') +
      (p.uptimeSeconds != null ? '<div class="muted">up ' + _fmtDur(p.uptimeSeconds) + '</div>' : '') + '</td>' +
      '<td>' + btns + '</td></tr>';
  });
  // configured pod specs with no live pod yet (lazy-deploy models)
  specs.forEach(function (s) {
    if (matched[s.backend + ':' + s.model]) return;
    html += '<tr><td><b>' + esc(s.backend) + ':' + esc(s.model) + '</b> <span class="badge runpod">managed</span>' +
      '<div class="muted">configured spec — not deployed' +
      (s.pod_id ? ' · pinned <code>' + esc(s.pod_id) + '</code> (not found)' : '') + '</div></td>' +
      '<td><span class="badge dim">not deployed</span></td><td class="muted">—</td><td class="muted">—</td>' +
      '<td><button class="btn btn-sm" onclick="testRunpodModel(\'' + esc(s.backend) + '\',\'' + esc(s.model) + '\')">⚗ test (deploys)</button></td></tr>';
  });
  if (!inv.pods.length && !specs.length)
    html += '<tr><td colspan="5" class="muted">No pods deployed.</td></tr>';
  html += '</tbody></table>';
  box.innerHTML = html;
}
function runpodPodAction(podId, action) {
  var msg = action === 'terminate'
    ? 'Terminate pod ' + podId + '? This cannot be undone — it frees all storage.'
    : action + ' pod ' + podId + '?';
  if (!confirm(msg)) return;
  api('/admin/runpod/action', {method: 'POST', body: {pod_id: podId, action: action}})
    .then(function () { notify('✓ pod ' + action + 'd'); refreshRunpodPods(); })
    .catch(function (e) { notify('✗ ' + e.message, true); refreshRunpodPods(); });
}
function testRunpodModel(backend, model) {
  if (!confirm('Test ' + backend + ':' + model + '?\nLoads the pod if needed (may take a minute) and runs a diagnostic chat.'))
    return;
  notify('⚗ testing ' + backend + ':' + model + '…');
  api('/admin/runpod/test', {method: 'POST', body: {backend: backend, model: model, after: 'keep'}})
    .then(function (d) { showRunpodTestReport(backend, model, d); refreshRunpodPods(); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function showRunpodTestReport(backend, model, d) {
  notify((d.ok ? '✓ ' : '✗ ') + backend + ':' + model + (d.ok ? ' passed' : ' failed'), !d.ok);
  var ph = d.phases || {};
  var html = '<div class="widget"><h3>⚗ ' + esc(backend) + ':' + esc(model) + ' ' +
    (d.ok ? '<span class="badge ok">OK</span>' : '<span class="badge err">FAILED</span>') +
    ' <span class="muted">' + (d.elapsed_s || 0) + 's total</span></h3>';
  if (d.error) html += '<div class="kv" style="color:var(--danger)">' + esc(d.error) + '</div>';
  var p = ph.pod || {};
  html += '<div class="kv"><b>pod</b>: ' + esc(p.action || '—') +
    (p.pod_id ? ' · <code>' + esc(p.pod_id) + '</code>' : '') +
    (p.state ? ' · ' + esc(p.state) : '') +
    (p.elapsed_s != null ? ' · ' + p.elapsed_s + 's' : '') + '</div>';
  if (p.pod && (p.pod.gpuTypeId || p.pod.costPerHour))
    html += '<div class="kv muted">' + esc(p.pod.gpuTypeId || '') +
      (p.pod.costPerHour ? ' · $' + p.pod.costPerHour + '/hr' : '') + '</div>';
  if (p.error) html += '<div class="kv" style="color:var(--danger)">pod: ' + esc(p.error) + '</div>';
  var h = ph.health || {};
  if (h.base_url) html += '<div class="kv"><b>proxy</b>: <code>' + esc(h.base_url) + '</code></div>';
  ['health', 'models'].forEach(function (k) {
    var pr = h[k];
    if (!pr) return;
    html += '<div class="kv muted">' + k + ' probe: ' +
      (pr.error ? '✗ ' + esc(pr.error)
        : pr.status + ' (' + pr.ms + 'ms)' +
          (pr.ids && pr.ids.length ? ' · serving ' + esc(pr.ids.join(', ')) : '')) + '</div>';
  });
  if (h.error) html += '<div class="kv" style="color:var(--danger)">health: ' + esc(h.error) + '</div>';
  var c = ph.chat || {};
  if (c.content) html += '<div class="kv"><b>chat reply</b>: ' + esc(c.content) +
    (c.elapsed_s != null ? ' <span class="muted">(' + c.elapsed_s + 's)</span>' : '') + '</div>';
  if (c.usage && c.usage.total_tokens) html += '<div class="kv muted">' +
    (c.usage.prompt_tokens || 0) + ' in + ' + (c.usage.completion_tokens || 0) +
    ' out = ' + c.usage.total_tokens + ' tokens</div>';
  if (c.error) html += '<div class="kv" style="color:var(--danger)">chat: ' + esc(c.error) + '</div>';
  if (c.skipped) html += '<div class="kv muted">chat: skipped (' + esc(c.skipped) + ')</div>';
  if (d.logs_error) html += '<div class="kv" style="color:var(--warning)">logs: ' + esc(d.logs_error) + '</div>';
  if ((d.logs || []).length) {
    html += '<div class="kv" style="margin-top:8px"><b>container logs</b> (tail ' + d.logs.length + '):</div>' +
      '<div class="logs" style="max-height:200px">';
    d.logs.forEach(function (l) {
      html += '<div class="log-entry"><span class="log-time">' + esc(l.ts || '') + '</span> ' +
        '<span class="log-level">' + esc(l.source || '') + '</span> <span class="log-msg">' + esc(l.line) + '</span></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('modal-title').textContent = '⚗ RunPod test — ' + backend + ':' + model;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

    var start_timeout_s = document.getElementById('s-start_timeout_s');
    if (start_timeout_s && start_timeout_s.value) payload.start_timeout_s = parseFloat(start_timeout_s.value);

function checkRunpodInventory() {
  api('/admin/runpod/inventory', {method: 'POST'}).then(function (d) {
    var html = '<div class="widget"><h3>RunPod Inventory</h3>';
    if (d.error) {
      html += '<div style="color:var(--danger)">' + esc(d.error) + '</div>';
    } else {
      html += '<h4>Live pods (' + d.pods.length + ')</h4>';
      if (d.pods.length) {
        html += '<table><thead><tr><th>id</th><th>name</th><th>status</th><th></th></tr></thead><tbody>';
        d.pods.forEach(function (p) {
          html += '<tr><td><code>' + esc(p.id) + '</code></td><td>' + esc(p.name) + '</td><td>' + esc(p.status) + '</td>' +
            '<td>' +
            '<button class="btn btn-sm" onclick="runpodAction(\'' + esc(p.id) + '\',\'start\')">start</button> ' +
            '<button class="btn btn-sm" onclick="runpodAction(\'' + esc(p.id) + '\',\'stop\')">stop</button> ' +
            '<button class="btn btn-sm btn-danger" onclick="runpodAction(\'' + esc(p.id) + '\',\'terminate\')">terminate</button>' +
            '</td></tr>';
        });
        html += '</tbody></table>';
      } else {
        html += '<div class="muted">No pods</div>';
      }
      html += '<h4 style="margin-top:10px;">Live endpoints (' + d.endpoints.length + ')</h4>';
      if (d.endpoints.length) {
        html += '<table><thead><tr><th>id</th><th>name</th><th>max workers</th><th></th></tr></thead><tbody>';
        d.endpoints.forEach(function (e) {
          var refs = (e.referenced_by || []).join(', ');
          html += '<tr><td><code>' + esc(e.id) + '</code></td><td>' + esc(e.name) +
            (refs ? '<div class="muted">used by ' + esc(refs) + '</div>' : '') + '</td>' +
            '<td>' + (e.workersMax == null ? '—' : e.workersMax) + '</td>' +
            '<td><button class="btn btn-sm btn-danger" onclick="deleteEndpoint(\'' + esc(e.id) + '\')">delete</button></td></tr>';
        });
        html += '</tbody></table>';
      } else {
        html += '<div class="muted">No endpoints</div>';
      }
      if (d.stale && d.stale.length) {
        html += '<h4 style="margin-top:10px;color:var(--danger);">Stale references (' + d.stale.length + ')</h4>';
        html += '<table><thead><tr><th>backend:model</th><th>type</th><th>id</th><th></th></tr></thead><tbody>';
        d.stale.forEach(function (s) {
          html += '<tr><td><b>' + esc(s.backend) + ':' + esc(s.model) + '</b></td><td>' + esc(s.type) + '</td><td><code>' + esc(s.id) + '</code></td>' +
            '<td><button class="btn btn-sm btn-danger" onclick="removeStaleModel(\'' + esc(s.backend) + '\',\'' + esc(s.model) + '\')">remove</button></td></tr>';
        });
        html += '</tbody></table>';
      } else {
        html += '<div class="muted" style="margin-top:10px;">✓ All configured entities are live</div>';
      }
    }
    html += '</div>';
    // Show in a modal
    document.getElementById('modal-title').textContent = '🔌 RunPod Inventory';
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal').classList.add('show');
  }).catch(function (e) { notify('✗ ' + e.message, true); });
}
function removeStaleModel(backend, model) {

function runpodAction(podId, action) {
  var msg = action === 'terminate' ? 'Terminate pod ' + podId + '? This cannot be undone.' :

  api('/admin/runpod/action', {method: 'POST', body: {pod_id: podId, action: action}})
    .then(function () { notify('✓ pod ' + action + 'd'); checkRunpodInventory(); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}

    .then(function () { notify('✓ endpoint deleted'); checkRunpodInventory(); })

function fmInit() {}
function fmRestore() { // re-render persisted state after a tab switch
  if (_fmLast) fmRenderResults();
  if (_fmFiles) fmRenderFiles();
  if (_fmPick) fmRenderConfig();
  fmUpVolFill();
  var up = _fmUp;

// ----- task chips -----
function fmChipsHtml() {
  var html = '';
  for (var i = 0; i < _fmTasks.length; i++) {
    var t = _fmTasks[i];
    html += '<button type="button" class="fm-chip' + (_fmTask === t.key ? ' active' : '') +
      '" onclick="fmSetTask(\'' + esc(t.key) + '\')" title="' +
      esc(t.full || t.label) + '">' + esc(t.label) + '</button>';
  }
  return html;
}
function fmSetTask(key) {
  _fmTask = (_fmTask === key) ? '' : key; // click the active chip again to clear
  var box = document.getElementById('fm-chips');
  if (box) box.innerHTML = fmChipsHtml();
  fmSearch();
}
// fold the backend's long labels in as chip tooltips
function fmMergeTaskTitles(tasks) {
  if (!tasks || !tasks.length) return;
  for (var i = 0; i < tasks.length; i++) {
    var t = tasks[i] || {};
    for (var j = 0; j < _fmTasks.length; j++)
      if (_fmTasks[j].key === t.key) { _fmTasks[j].full = String(t.label || ''); break; }
  }
  var box = document.getElementById('fm-chips');
  if (box) box.innerHTML = fmChipsHtml();
}

// ----- search -----
function fmOnQKey(e) {
  if (e && (e.key === 'Enter' || e.keyCode === 13)) fmSearch();
}
function fmSearch() {
  var qEl = document.getElementById('fm-q');
  var sEl = document.getElementById('fm-source');
  var q = qEl ? qEl.value.trim() : '';
  var source = sEl ? sEl.value : 'all';
  if (!q && !_fmTask) {
    _fmLast = null;
    fmRenderResults('<div class="muted" style="margin:8px 0 0">Pick a task above or type a query.</div>');
    return;
  }
  // a new search invalidates any file pick / config below
  if (_fmPick || _fmFiles) { _fmPick = null; _fmFiles = null; _fmPlan = null; _fmMsg = null;
    fmRenderFiles(); fmRenderConfig(); }
  var box = document.getElementById('fm-results');
  if (box) box.innerHTML = '<div class="muted" style="margin:8px 0 0">searching…</div>';
  api('/admin/models/search?q=' + encodeURIComponent(q) + '&source=' +
      encodeURIComponent(source) + '&task=' + encodeURIComponent(_fmTask) + '&limit=10')
    .then(function (d) {
      _fmLast = d;
      fmMergeTaskTitles(d.tasks);
      fmRenderResults();
    })
    .catch(function (e) { _fmLast = null; fmRenderResults(errBox(e)); });
}
function fmRenderResults(preHtml) {
  var box = document.getElementById('fm-results');
  if (!box) return;
  if (preHtml != null) { box.innerHTML = preHtml; return; }
  var d = _fmLast;
  if (!d) { box.innerHTML = ''; return; }
  var recipes = d.recipes || [], results = d.results || [], html = '';
  if (recipes.length) {
    html += '<div class="fm-group">Recommended — tested recipes (loads the deploy wizard below)</div>';
    for (var i = 0; i < recipes.length; i++) {
      var r = recipes[i] || {};
      html += '<div class="fm-row" role="button" tabindex="0" onclick="fmLoadRecipe(\'' +
        esc(r.id) + '\')" onkeydown="fmRowKey(event)" title="Load ' + esc(r.model) +
        ' into the deploy wizard below">' +
        '<span class="fm-name">' + esc(r.model) + '</span>' +
        (r.quant ? '<span class="fm-cap solid">' + esc(r.quant) + '</span>' : '') +
        '<span class="fm-sub">' + esc(r.size_gb) + ' GB</span>' +
        fmCapBadges(r.capabilities, null) +
        (r.tagline ? '<span class="fm-sub" style="margin-left:auto">' + esc(r.tagline) + '</span>' : '') +
        '</div>';
    }
  }
  if (results.length) {
    html += '<div class="fm-group">Repo results — click to pick a file</div>';
    for (var k = 0; k < results.length; k++) {
      var it = results[k] || {};
      var cls = it.source === 'hf' ? 'hf' : it.source === 'modelscope' ? 'ms' : 'oll';
      var lbl = it.source === 'hf' ? 'HF' : it.source === 'modelscope' ? 'MS' : 'OLL';
      html += '<div class="fm-row" role="button" tabindex="0" onclick="fmPickRepo(\'' +
        esc(it.source) + '\',\'' + esc(it.repo_id) + '\')" onkeydown="fmRowKey(event)">' +
        '<span class="fm-src ' + cls + '">' + lbl + '</span>' +
        '<span class="fm-name">' + esc(it.name || it.repo_id) + '</span>' +
        fmCapBadges(it.capabilities, it.evidence) +
        '<span class="fm-sub" style="margin-left:auto">' +
        (it.downloads != null && it.downloads !== '' ? fmFmtNum(it.downloads) + ' ↓&nbsp; ' : '') +
        (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener" ' +
          'title="open repo page" onclick="fmStop(event)">↗</a>' : '') +
        '</span></div>';
    }
  }
  if (!html) html = '<div class="muted" style="margin:8px 0 0">No matches — try a shorter query or another source.</div>';
  box.innerHTML = html;
}
function fmRowKey(e) { // keyboard support for the clickable rows
  if (e && (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32)) {
    if (e.preventDefault) e.preventDefault();
    var el = e.currentTarget || e.target;
    if (el && el.click) el.click();
  }
}
function fmStop(e) { if (e && e.stopPropagation) e.stopPropagation(); }
// curated evidence → solid badge; anything else → dimmed with a tooltip
function fmCapBadges(caps, evidence) {
  var html = '', cs = caps || [];
  for (var i = 0; i < cs.length; i++) {
    var c = String(cs[i] || '');
    var ev = evidence ? String(evidence[c] || '') : '';
    var solid = ev.indexOf('curated:') === 0;

  var p = _fmPick;

  var cost = (_fmPlan && _fmPlan.est_cost_per_hr != null)
    ? ' · est $' + Number(_fmPlan.est_cost_per_hr).toFixed(2) + '/hr' : '';
  var msg = 'Deploy ' + p.file.name + '?\n' +
    _fmState.gpuCount + '× ' + _fmState.gpuId + ' (' + _fmState.cloud + ')' + cost + '\n' +
    'The pod bills per hour until you stop it.';
  if (!confirm(msg)) return;
  var btn = document.getElementById('fm-deploy-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Deploying…'; }
  var headers = {'Content-Type': 'application/json'};
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  fetch('/admin/models/deploy-custom', {method: 'POST', headers: headers,
      body: JSON.stringify(fmBuildPayload())})
    .then(function (r) {
      return r.json().then(
        function (d) { return {status: r.status, data: d}; },
        function () { return {status: r.status, data: null}; });
    })
    .then(function (res) {
      if (res.status === 200 && res.data && res.data.ok) {
        _fmMsg = {type: 'ok', html: fmSuccessHtml(res.data)};
        notify('✓ deploying ' + res.data.model);
        bwOpenDeploy(res.data);
        refreshRunpodPods();
      } else {
        _fmMsg = {type: 'err', html: fmDeployErrHtml(res)};
      }
      fmRenderConfig();
    })
    .catch(function (e) {
      _fmMsg = {type: 'err', html: '<b>✗ Deploy failed</b> — ' + esc(e.message)};
      fmRenderConfig();
    });
}
function fmDeployErrHtml(res) {
  var d = res.data || {};
  var errs = d.detail && d.detail.errors; // 422 invalid_selection
  if (errs && errs.length) {
    var lis = '';
    for (var i = 0; i < errs.length; i++) lis += '<li>' + esc(errs[i]) + '</li>';
    return '<b>✗ This configuration cannot be deployed</b><ul>' + lis + '</ul>';
  }
  if (d.error && d.error.message && d.tried && d.tried.length) // 502 with tried list
    return '<b>✗ Deploy failed</b> — ' + esc(d.error.message) + clTriedHtml(d.tried);
  var m = (d.detail && (d.detail.message || d.detail.code)) ||
    (d.error && d.error.message) || ('HTTP ' + res.status);
  return '<b>✗ Deploy failed</b> — ' + esc(m);
}
function fmSuccessHtml(d) {
  var url = location.origin + '/v1/chat/completions';
  var html = '<b>✓ Deploying ' + esc(d.model) + '</b>' +

    ' · pod <code>' + esc(d.pod_id) + '</code>' +

  }
  html += clTriedHtml(d.tried);
  html += '<div style="margin-top:6px">Use model "' + esc(d.model) +
    '" in any OpenAI- or Anthropic-compatible tool → <code>' + esc(url) + '</code></div>' +
    '<div class="dw-hint">Boot takes a few minutes (weights download first) — a boot-watch popup is tracking it, and it appears in the RunPod servers widget.</div>';
  if (_fmPick && _fmPick.upload) {

function fmCleanBtnHtml() {

function fmCleanup() {

// ---------- Serverless (v4.5): deploy-type toggle + scale-to-zero ----------
// Serverless endpoints ride the normal chat API with model = alias — no new
// request routing. First request after idle pays a ~1-3 min cold start.

// toggle handler for the fm config panel's Deploy type radios
function svOnTypeChange(type) {
  var v = type === 'serverless' ? 'serverless' : 'pod';
  if (_fmState.deployType === v) return;
  _fmState.deployType = v;
  _fmMsg = null;
  if (v === 'serverless') {
    svSeedVolume();
    // only pool-backed GPUs can serve serverless — re-pick when needed
    var g = _fmState.gpuId ? dwFindGpu(_fmState.gpuId) : null;
    if (!g || !g.pool) { _fmState.gpuId = null; _fmPlan = null; fmAutoPlan(); return; }
  }
  fmRenderConfig();
}

// serverless rows of the fm config panel: GPU (pool-only), ctx, workers,
// idle, volume. p = _fmPick, ctxRow = shared context-preset markup.
function svConfigRows(p, ctxRow) {
  var st = _fmState;
  var html = '<div class="srow"><label for="fm-gpu">GPU type</label>' +
    '<select id="fm-gpu" onchange="fmOnGpuChange()">' + svGpuOptions() + '</select>' +
    '<span class="muted">only GPUs with a serverless pool are listed</span></div>';
  html += ctxRow;
  html += '<div class="srow"><label for="fm-sl-workers">Workers max</label>' +
    '<input id="fm-sl-workers" type="number" min="1" value="' + esc(String(st.slWorkers || 1)) +
    '" oninput="svOnWorkersInput()">' +
    '<span class="muted">requests beyond this wait in queue</span></div>';
  html += '<div class="srow"><label for="fm-sl-idle">Idle timeout (min)</label>' +
    '<input id="fm-sl-idle" type="number" min="1" value="' + esc(String(st.slIdleMin || 5)) +
    '" oninput="svOnIdleInput()">' +
    '<span class="muted">scale to zero after this many idle minutes</span></div>';
  html += svVolumeRows(p);
  return html;
}

// pool-bearing GPUs only, cheapest first
function svGpuOptions() {
  if (!_dwCatalog) return '<option value="">loading GPU options…</option>';
  var gs = _dwCatalog.gpus || [], avail = [];
  for (var i = 0; i < gs.length; i++)
    if (gs[i].pool && dwGpuAvailable(gs[i], _fmState.cloud)) avail.push(gs[i]);
  if (!avail.length)
    return '<option value="">no pool-backed GPUs offered right now</option>';
  avail.sort(function (a, b) {
    var pa = (a.price || {})[_fmState.cloud] || 0, pb = (b.price || {})[_fmState.cloud] || 0;
    if (pa !== pb) return pa - pb;
    return a.memory - b.memory;
  });
  var html = '';
  for (var k = 0; k < avail.length; k++) {
    var g = avail[k];
    var price = (g.price || {})[_fmState.cloud];
    var lbl = g.id + ' (' + g.memory + ' GB · pool ' + g.pool + ')';
    if (price > 0) lbl += ' — $' + price + '/hr';
    html += '<option value="' + esc(g.id) + '"' + (g.id === _fmState.gpuId ? ' selected' : '') + '>' +
      esc(lbl) + '</option>';
  }
  return html;
}

// serverless storage: uploads MUST mount the receiver's volume; hf
// repo picks need NO volume — the worker downloads the model from
// Hugging Face at cold start (no pod storage for serverless)
function svVolumeRows(p) {
  var st = _fmState;
  if (p.upload) {
    if (p.volumeId) {
      return '<div class="srow"><label>Storage volume</label><span><b>' +
        esc(svVolumeLabel(p.volumeId)) + '</b></span>' +
        '<span class="muted">the uploaded file lives on this volume — the endpoint mounts it</span></div>';
    }
    return '<div class="dw-msg err" style="margin-top:8px"><b>Serverless needs the file on a network volume</b> — ' +
      'this upload went to the receiver pod&#39;s ephemeral disk. Pick a network volume in the ' +
      'Local file card above and upload again, then switch back to Serverless.</div>';
  }
  if (p.source !== 'hf') {
    return '<div class="dw-msg err" style="margin-top:8px"><b>Serverless supports Hugging Face repos and local uploads</b> — ' +
      'a worker can only download from Hugging Face at cold start. Use Pod deployment for ' +
      esc(p.source) + ' files.</div>';
  }
  return '<div class="srow"><label>Model storage</label><span><b>Hugging Face download</b></span>' +
    '<span class="muted">the worker downloads ' + esc(p.file.name) +
    ' from Hugging Face when it cold-starts — no volume, no helper pod</span></div>';
}

function svVolumeLabel(volumeId) {
  var vols = (_dwCatalog && _dwCatalog.volumes) || [];
  for (var i = 0; i < vols.length; i++)
    if (vols[i].id === volumeId) return (vols[i].name || vols[i].id) + ' — ' + vols[i].size + ' GB';
  return volumeId;
}

function svCostHtml() {
  var g = _fmState.gpuId ? dwFindGpu(_fmState.gpuId) : null;
  var price = g ? Number((g.price || {})[_fmState.cloud] || 0) : 0;
  if (!g || !price) return '<span class="muted">scales to zero — $0 while idle</span>';
  return '$' + price.toFixed(2) + '/hr while a worker runs <span class="muted">— $0 when scaled to zero</span>';
}

function svDeployable() {
  var p = _fmPick;
  if (!p) return false;
  if (p.mmproj) return false; // v1: serverless env carries no mmproj
  if (p.upload) return !!p.volumeId;
  if (p.source !== 'hf') return false; // worker downloads from HF only
  var g = _fmState.gpuId ? dwFindGpu(_fmState.gpuId) : null;
  return !!(g && g.pool && _fmPlan && _fmPlan.fits && _fmState.ctxKey);
}

function svBuildPayload() {
  var p = _fmPick, st = _fmState;
  var ctxTotal = 32768;
  var co = (_fmPlan && _fmPlan.ctx_options) || [];
  for (var i = 0; i < co.length; i++)
    if (co[i].key === st.ctxKey && co[i].ctx_total) ctxTotal = co[i].ctx_total;
  var body = {
    backend: '',
    source: p.upload ? 'upload' : p.source,
    repo_id: p.repoId || '',
    file_name: p.file.name,
    file_url: p.upload ? '' : p.file.url,
    size_gb: p.file.size_gb,
    gpu_id: st.gpuId || '',
    alias: (st.alias || '').trim(),
    workers_max: Math.max(1, st.slWorkers || 1),
    idle_timeout: Math.max(1, st.slIdleMin || 5),
    queue_delay: 4,
    ctx_total: ctxTotal
  };
  if (p.upload) {
    body.volume_id = p.volumeId || '';
  }
  return body;
}

function svDeploy() {
  var p = _fmPick;
  if (!p || !svDeployable()) return;
  var alias = (_fmState.alias || '').trim() || p.file.name.replace(/\.gguf$/i, '');
  var msg = 'Deploy ' + p.file.name + ' serverless?\n' +
    (_fmState.gpuId || 'cheapest fitting pool GPU') + ' · max ' +
    Math.max(1, _fmState.slWorkers || 1) + ' worker(s) · idle ' +
    Math.max(1, _fmState.slIdleMin || 5) + ' min\n' +
    (p.upload ? '' : 'The worker downloads the model from Hugging Face when it cold-starts.\n') +
    'The endpoint scales to zero; requests use model "' + alias + '".';
  if (!confirm(msg)) return;
  var btn = document.getElementById('fm-deploy-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating endpoint…'; }
  var headers = {'Content-Type': 'application/json'};
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  fetch('/admin/models/deploy-serverless', {method: 'POST', headers: headers,
      body: JSON.stringify(svBuildPayload())})
    .then(function (r) {
      return r.json().then(
        function (d) { return {status: r.status, data: d}; },
        function () { return {status: r.status, data: null}; });
    })
    .then(function (res) {
      if (res.status === 200 && res.data && res.data.ok) {
        _fmMsg = {type: 'ok', html: svSuccessHtml(res.data)};
        notify('✓ endpoint ready — model "' + res.data.model + '"');
        svLoad(); // refresh the panel below
      } else {
        _fmMsg = {type: 'err', html: fmDeployErrHtml(res)};
      }
      fmRenderConfig();
    })
    .catch(function (e) {
      _fmMsg = {type: 'err', html: '<b>✗ Deploy failed</b> — ' + esc(e.message)};
      fmRenderConfig();
    });
}

function svSuccessHtml(d) {

// ----- serverless config panel event handlers -----
function svOnWorkersInput() { _fmState.slWorkers = parseInt(document.getElementById('fm-sl-workers').value, 10) || 1; }

// ----- Serverless panel (Cloud tab, next to Pod lifecycle) -----
var _svData = null; // last /admin/serverless response

function svLoad() {
  var box = document.getElementById('cl-serverless-body');
  if (!box) return;
  api('/admin/serverless').then(function (d) {
    _svData = d;
    svRender();
  }).catch(function (e) {
    _svData = null;
    box.innerHTML = errBox(e);
  });
}

function svRender() {
  var box = document.getElementById('cl-serverless-body');
  if (!box) return;
  if (!_svData) { box.innerHTML = '<div class="muted">loading…</div>'; return; }
  var eps = _svData.endpoints || [], html = '';
  if (!eps.length) {
    html += '<div class="muted">No serverless endpoints yet. Deploy one from the model finder above — ' +
      'pick a file, then flip Deploy type to &quot;Serverless (scale to zero)&quot;.</div>';
  } else {
    html += '<table><thead><tr><th>model</th><th>GPU / pool</th><th class="num">size</th>' +
      '<th>live</th><th>workers max</th><th>idle min</th><th></th></tr></thead><tbody>';
    for (var i = 0; i < eps.length; i++) html += svRowHtml(eps[i] || {}, i);
    html += '</tbody></table>';
  }
  var un = _svData.untracked || [];
  html += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bg-deep)">' +
    '<div class="kv"><b>Untracked endpoints</b> <span class="muted">— on the RunPod account but not ' +
    'managed by the gateway (add one under Services)</span></div>';
  if (!un.length) html += '<div class="muted">none</div>';
  else {
    html += '<table><thead><tr><th>endpoint id</th><th>name</th><th>workers</th></tr></thead><tbody>';
    for (var j = 0; j < un.length; j++) {
      var u = un[j] || {};
      html += '<tr><td class="muted"><code>' + esc(u.endpoint_id || '?') + '</code></td>' +
        '<td class="muted">' + esc(u.name || '—') + '</td>' +
        '<td class="muted">' + esc(svWorkersBrief(u.workers || {})) + '</td></tr>';
    }
    html += '</tbody></table>';
  }
  html += '</div>';
  box.innerHTML = html;
}

function svRowHtml(e, i) {
  var w = (e.live && e.live.workers) || {};
  var sc = (e.live && e.live.scaling) || {};
  var wm = (e.workers_max != null ? e.workers_max : (w.max != null ? w.max : 1));
  var it = (e.idle_timeout != null ? e.idle_timeout : (w.idleTimeout != null ? w.idleTimeout : 5));
  var liveTxt;
  if (!e.exists) liveTxt = '<span class="badge err">gone from account</span>';
  else if (e.live) liveTxt = 'max ' + esc(String(w.max != null ? w.max : '?')) +
    ' · idle ' + esc(String(w.idleTimeout != null ? w.idleTimeout : '?')) + ' min' +
    (sc.queueDelay != null ? ' · queue ' + esc(String(sc.queueDelay)) + 's' : '') +
    (e.live.flashboot === 'ON' ? ' · flashboot' : '');
  else liveTxt = '<span class="muted">no live state</span>';
  var gpuTxt = e.gpu_id ? esc(e.gpu_id) : '—';
  if (e.pool) gpuTxt += ' <span class="muted">' + esc(e.pool) + '</span>';
  return '<tr><td><b>' + esc(e.alias || e.model || '?') + '</b>' +
    '<div class="muted"><code>' + esc(e.endpoint_id || '') + '</code>' +
    (e.source ? ' · ' + esc(e.source) : '') + '</div></td>' +
    '<td>' + gpuTxt + '</td>' +
    '<td class="num muted">' + (e.size_gb != null ? esc(String(e.size_gb)) + ' GB' : '—') + '</td>' +
    '<td class="muted">' + liveTxt + '</td>' +
    '<td><input id="sv-wm-' + i + '" class="lc-in" type="number" min="1" value="' + esc(String(wm)) + '"></td>' +
    '<td><input id="sv-it-' + i + '" class="lc-in" type="number" min="1" value="' + esc(String(it)) + '"></td>' +
    '<td><button class="btn btn-sm" onclick="svSave(' + i + ')">save</button> ' +
    '<button class="btn btn-sm btn-danger" onclick="svDelete(' + i + ')">delete</button></td></tr>';
}

function svWorkersBrief(w) {
  var bits = [];
  if (w.min != null) bits.push('min ' + w.min);
  if (w.max != null) bits.push('max ' + w.max);
  if (w.idleTimeout != null) bits.push('idle ' + w.idleTimeout + ' min');
  return bits.length ? bits.join(' · ') : '—';
}

function svSave(i) {
  var e = (_svData && (_svData.endpoints || [])[i]) || null;
  if (!e) return;
  var box = document.getElementById('cl-serverless-body');
  var wmEl = document.getElementById('sv-wm-' + i), itEl = document.getElementById('sv-it-' + i);
  if (!wmEl || !itEl) return;
  var body = {backend: e.backend || '', model: e.model || e.alias || '',
              workers_max: Math.max(1, parseInt(wmEl.value, 10) || 1),
              idle_timeout: Math.max(1, parseInt(itEl.value, 10) || 5)};
  if (box) box.innerHTML = '<div class="muted">saving…</div>';
  api('/admin/serverless/settings', {method: 'POST', body: body})
    .then(function () {
      notify('✓ saved — workers max ' + body.workers_max + ', idle ' + body.idle_timeout + ' min');
      svLoad();
    })
    .catch(function (err) {
      notify('✗ save failed — ' + err.message, true);
      svLoad();
    });
}

function svDelete(i) {
  var e = (_svData && (_svData.endpoints || [])[i]) || null;
  if (!e || !e.endpoint_id) return;
  var name = e.alias || e.model || e.endpoint_id;
  if (!confirm('Permanently delete endpoint ' + name + ' (' + e.endpoint_id + ')? Workers and queued jobs go with it.')) return;
  var box = document.getElementById('cl-serverless-body');
  if (box) box.innerHTML = '<div class="muted">deleting…</div>';
  api('/admin/runpod/action', {method: 'POST', body: {endpoint_id: e.endpoint_id, action: 'delete'}})
    .then(function () {
      notify('✓ endpoint deleted');
      // drop the config entry too so the panel doesn't show a ghost row
      if (e.backend && (e.model || e.alias))
        return api('/admin/runpod/serverless', {method: 'POST',
          body: {backend: e.backend, model: e.model || e.alias, delete: true}});
      return null;
    })
    .then(function () { svLoad(); })
    .catch(function (err) {
      notify('✗ delete failed — ' + err.message, true);
      svLoad();
    });
}

function fmUpRelay() {
  var up = _fmUp;
  var btn = document.getElementById('fm-up-btn');
  if (btn) btn.textContent = 'Uploading…';
  fmUpSetProgress('<div class="muted">relaying to receiver pod <code>' + esc(up.podId) + '</code>' +
    (up.reused ? ' (reused)' : '') + '…</div>' + fmUpBarHtml(2));
  fmUpPollStart();
  var xhr = new XMLHttpRequest();
  up.xhr = xhr;
  xhr.open('PUT', '/admin/models/upload');
  xhr.setRequestHeader('x-pod-id', up.podId);
  xhr.setRequestHeader('x-filename', up.filename);
  xhr.setRequestHeader('x-file-size', String(up.sizeBytes));
  xhr.onload = function () {
    if (up.done) return;
    up.done = true;
    fmUpPollStop();
    if (xhr.status === 200) { fmFinalize(); return; }
    var m = 'HTTP ' + xhr.status;
    try {
      var b = JSON.parse(xhr.responseText);
      if (b && b.error && b.error.message) m = b.error.message;
    } catch (err) {}
    fmUpFail('✗ relay failed — ' + m);
  };
  xhr.onerror = function () {
    if (!up.done) { up.done = true; fmUpPollStop(); fmUpFail('✗ relay failed — network error'); }
  };
  xhr.onabort = function () {

  };

}
// the gateway is localhost — browser progress is instant and useless;

}
function fmUpPollStop() {

}

  api('/admin/models/upload-status?pod_id=' + encodeURIComponent(up.podId) +
      '&filename=' + encodeURIComponent(up.filename))
    .then(function (d) {

}
function fmUpTick(bytes) {

    fmUpSetProgress('<div class="muted">relaying to receiver pod <code>' + esc(up.podId) + '</code>' +
      (up.reused ? ' (reused)' : '') + '…</div>' + fmUpBarHtml(2) +
      '<div class="muted">waiting for the receiver to accept bytes…</div>');

  var pct = up.sizeBytes ? Math.min(100, Math.round(up.got / up.sizeBytes * 100)) : 0;
  fmUpSetProgress('<div class="muted">relaying to receiver pod <code>' + esc(up.podId) + '</code>' +
    (up.reused ? ' (reused)' : '') + '…</div>' + fmUpBarHtml(pct) +
    '<div class="muted">' + esc(fmtMB(Math.round(up.got / 1048576))) + ' of ' +
    esc(fmtMB(Math.round(up.sizeBytes / 1048576))) + ' relayed — ' + pct + '%</div>');
}

// ----- catalog lookups -----
function dwRecipe() {
  if (!_dwCatalog || !_dwState.recipeId) return null;

function dwFindGpu(id) {

  return null;
}
function dwGpuAvailable(g, cloud) {
  if (!g) return false;

  return p > 0 && mc > 0;
}
function dwCountFor(recipe, g, cloud) {
  var opts = recipe.gpu_options || [];
  for (var i = 0; i < opts.length; i++)
    if (opts[i].gpu === g.id) return opts[i].count; // recommended count
  var mc = Math.min((g.maxCount || {})[cloud] || 0, 8);
  if (recipe.vram_min_gb && g.memory) {

  }

}

  for (var i = 0; i < dcs.length; i++)

}

  return dcs;
}

}

// ----- defaults -----
function dwApplyRecipeDefaults() {
  var r = dwRecipe(); if (!r || !_dwCatalog) return;
  var st = _dwState;
  st.cloud = 'secure';
  var g0 = null, opts = r.gpu_options || [], i;
  for (i = 0; i < opts.length; i++) { g0 = dwFindGpu(opts[i].gpu); if (g0) break; }
  if (!g0) { // fall back to first catalog GPU that fits the recipe on its own
    var gs = _dwCatalog.gpus || [];
    for (var j = 0; j < gs.length; j++)
      if (dwGpuAvailable(gs[j], 'secure') && (!r.vram_min_gb || gs[j].memory >= r.vram_min_gb)) { g0 = gs[j]; break; }
  }
  if (!g0) g0 = (_dwCatalog.gpus || [])[0] || null;
  st.gpuId = g0 ? g0.id : null;
  st.gpuCount = g0 ? dwCountFor(r, g0, 'secure') : 1;
  if (r.volume) {
    var vols = _dwCatalog.volumes || [];
    st.volumeMode = vols.length ? 'existing' : 'create';
    st.volumeId = vols.length ? vols[0].id : null;
    st.volumeSizeGb = r.volume.size_gb_min;
    st.volumeType = 'STANDARD';
    st.dcId = vols.length ? (vols[0].dataCenter || '') : (dwCapableDcs()[0] ? dwCapableDcs()[0].id : '');
  } else {
    st.volumeMode = 'none';
    st.volumeId = null;
    st.dcId = '';
  }
  var co = r.ctx_options || [];
  st.ctxKey = r.ctx_default || (co[0] && co[0].key) || null;

}
function dwValidateState() { // keep _dwState consistent with the (possibly refreshed) catalog
  var st = _dwState;
  if (!_dwCatalog) return;
  var r = dwRecipe();
  if (st.recipeId && !r) { st.recipeId = null; return; }
  if (!st.recipeId || !r) return;
  if (st.gpuId && !dwFindGpu(st.gpuId)) dwApplyRecipeDefaults();
  var co = r.ctx_options || [], found = false, i;
  for (i = 0; i < co.length; i++) if (co[i].key === st.ctxKey) found = true;
  if (!found) st.ctxKey = r.ctx_default || (co[0] && co[0].key) || null;
  if (r.volume) {
    var vols = _dwCatalog.volumes || [];
    if (st.volumeMode !== 'create' && !vols.length) st.volumeMode = 'create';
    if (st.volumeMode === 'existing') {
      if (!dwSelectedVolume()) st.volumeId = vols.length ? vols[0].id : null;
      if (!dwSelectedVolume()) st.volumeMode = 'create';
    }
    if (st.volumeMode === 'create') {
      var caps = dwCapableDcs(), dcOk = false;

      var types = dwDcTypes(st.dcId);
      if (types.length && types.indexOf(st.volumeType) < 0) st.volumeType = types[0];

        st.volumeSizeGb = r.volume.size_gb_min;
    }
  }
  if (r.disk_gb_min && (!st.diskGb || st.diskGb < r.disk_gb_min)) st.diskGb = r.disk_gb_min;
  var g = dwFindGpu(st.gpuId);
  if (g) {

// ----- deploy -----
function dwBuildPayload() {
  var r = dwRecipe(), st = _dwState;
  var body = {
    recipe_id: r.id,
    gpu_id: st.gpuId,
    gpu_count: st.gpuCount,
    cloud: st.cloud,
    data_center_id: '',
    volume_mode: r.volume ? st.volumeMode : 'none',
    ctx_key: st.ctxKey,
    container_disk_gb: st.diskGb || r.disk_gb_min,
    idle_stop_s: st.idleS, // 0 disables — watchdog stops (never terminates) the idle pod
    alias: ''
  };
  if (r.volume) {
    if (st.volumeMode === 'existing') {
      var v = dwSelectedVolume();
      if (v) {
        body.volume_id = v.id;
        body.volume_size_gb = v.size;
        body.volume_type = v.type;
        body.data_center_id = v.dataCenter;
      }
    } else {
      body.volume_size_gb = st.volumeSizeGb || r.volume.size_gb_min;
      body.volume_type = st.volumeType;
      body.data_center_id = st.dcId;
    }
  } else {
    body.data_center_id = st.dcId || '';
  }
  return body;
}
function dwSuccessHtml(d) {
  var url = location.origin + '/v1/chat/completions';
  var html = '<b>✓ Deploying ' + esc(d.model) + '</b>' +
    (d.name ? ' — <code>' + esc(d.name) + '</code>' : '') +
    ' · pod <code>' + esc(d.pod_id) + '</code>' +
    (d.est_cost_per_hr != null ? ' · est $' + d.est_cost_per_hr + '/hr' : '');
  // capacity fallback: the combo that LANDED may differ from the user's choice
  var landed = d.landed || {};
  if (landed.gpu_id && (landed.gpu_id !== _dwState.gpuId ||
                        landed.gpu_count !== _dwState.gpuCount)) {
    html += '<div style="margin-top:6px;color:var(--warning)">⚠ Note: your GPU choice had no capacity — deployed on ' +
      esc(landed.gpu_id) + ' × ' + esc(landed.gpu_count) +
      (landed.est_cost_per_hr != null ? ' ($' + Number(landed.est_cost_per_hr).toFixed(2) + '/hr)' : '') +
      ' instead</div>';
  }
  html += clTriedHtml(d.tried);
  html += '<div style="margin-top:6px">Use model "' + esc(d.model) +
    '" in any OpenAI- or Anthropic-compatible tool → <code>' + esc(url) + '</code></div>' +
    '<div class="dw-hint">Boot takes a few minutes (model copy + load) — a boot-watch popup is tracking it, and it appears in the RunPod servers widget below.</div>';
  return html;
}
// list of GPU combos that were tried but had no capacity (deploy fallback info)
function clTriedHtml(tried) {
  if (!tried || !tried.length) return '';
  var html = '<div class="muted" style="margin-top:6px">GPU combos that had no capacity:</div>' +
    '<ul class="muted" style="margin:4px 0 0 18px">';
  for (var i = 0; i < tried.length; i++) {
    var t = tried[i] || {};
    html += '<li>' + esc((t.gpu_count || 1) + '× ' + (t.gpu_id || '?')) +
      (t.est_cost_per_hr != null ? ' ($' + Number(t.est_cost_per_hr).toFixed(2) + '/hr)' : '') +
      (t.error ? ' — ' + esc(t.error) : '') + '</li>';
  }
  return html + '</ul>';
}
function dwDeploy() {
  var r = dwRecipe(), st = _dwState;
  if (!r) return;
  var g = dwFindGpu(st.gpuId);
  if (!g) { notify('✗ pick a GPU first', true); return; }
  var p = (g.price || {})[st.cloud], cost = '';
  if (p > 0) cost = ' · est $' + (p * st.gpuCount).toFixed(2) + '/hr';
  var where = (r.volume && st.volumeMode === 'existing')
    ? (dwSelectedVolume() || {}).dataCenter : st.dcId;
  var msg = 'Deploy ' + r.model + ' (' + r.quant + ')?\n' +
    st.gpuCount + '× ' + g.id + ' (' + st.cloud + ')' +
    (where ? ' · ' + where : '') + cost + '\n' +
    'The pod bills per hour until you stop it.';
  if (!confirm(msg)) return;
  var btn = document.getElementById('dw-deploy-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Deploying…'; }
  var headers = {'Content-Type': 'application/json'};
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  fetch('/admin/catalog/deploy', {method: 'POST', headers: headers, body: JSON.stringify(dwBuildPayload())})
    .then(function (resp) {
      return resp.json().then(
        function (d) { return {status: resp.status, data: d}; },
        function () { return {status: resp.status, data: null}; });
    })
    .then(function (res) {
      if (res.status === 200 && res.data && res.data.ok) {
        _dwMsg = {type: 'ok', html: dwSuccessHtml(res.data)};
        notify('✓ deploying ' + res.data.model);
        bwOpenDeploy(res.data);
        refreshRunpodPods();
      } else {
        var errs = res.data && res.data.detail && res.data.detail.errors;
        if (errs && errs.length) {
          var lis = '';
          for (var i = 0; i < errs.length; i++) lis += '<li>' + esc(errs[i]) + '</li>';
          _dwMsg = {type: 'err', html: '<b>✗ This configuration cannot be deployed</b><ul>' + lis + '</ul>'};
        } else if (res.data && res.data.error && res.data.error.message &&
                   res.data.tried && res.data.tried.length) {
          _dwMsg = {type: 'err', html: '<b>✗ Deploy failed</b> — ' + esc(res.data.error.message) +
            clTriedHtml(res.data.tried)};
        } else {
          var m = (res.data && res.data.detail && (res.data.detail.message || res.data.detail.code)) ||
            (res.data && res.data.error && res.data.error.message) || ('HTTP ' + res.status);
          _dwMsg = {type: 'err', html: '<b>✗ Deploy failed</b> — ' + esc(m)};
        }
      }
      dwRenderAll();
    })
    .catch(function (e) {
      _dwMsg = {type: 'err', html: '<b>✗ Deploy failed</b> — ' + esc(e.message)};
      dwRenderAll();
    });
}
