    var sev = a.severity === 'critical' ? 'critical' : a.severity === 'warn' ? 'warn' : 'info';
    html += '<div class="lc-alert ' + sev + '">' +
      '<span class="muted">' + esc(String(a.ts || '').slice(11, 19) || '—') + '</span> ' +
      '<b>[' + esc(a.kind || '?') + ']</b> ' + esc(a.model || a.backend || '—') + ' — ' +
      esc(a.message || '') + '</div>';
  }
  box.innerHTML = html + '</div>';
}

function clRenderLifecycle() {
  var box = document.getElementById('cl-lifecycle-body');
  if (!box) return;
  if (!_clLifecycle) { box.innerHTML = '<div class="muted">loading…</div>'; return; }
  // don't clobber in-progress edits with a poll refresh
  var ae = document.activeElement;
  if (ae && box.contains(ae) &&
      (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) return;
  var d = _clLifecycle, html = '';
  // watchdog chip
  var wd = d.watchdog || {};
  html += '<div class="kv">' + (wd.running
    ? '<span class="badge ok">watchdog ● running (' + Math.round(wd.interval_s || 0) + 's)</span>'
    : '<span class="badge warn">watchdog ● paused</span>') + '</div>';
  // account budget: month-to-date vs cap, progress bar when a cap is set
  var mtd = d.month_to_date, cap = Number(d.budget_usd_month) || 0;
  var spent = (mtd && mtd.total_usd != null) ? Number(mtd.total_usd) : null;
  html += '<div class="kv" style="margin-top:8px"><b>Month spend</b> ' +
    (spent != null ? '$' + spent.toFixed(2) : '—');
  if (cap > 0) {
    html += ' / cap $' + cap.toFixed(2) + '</div>';
    if (spent != null) {
      var pct = Math.round(spent / cap * 100);
      var cls = pct > 100 ? 'err' : pct >= 80 ? 'warn' : '';
      html += '<div class="bar lc-budgetbar"><div class="bar-fill ' + cls +
        '" style="width:' + Math.min(pct, 100) + '%"></div></div>' +
        '<div class="muted">' + pct + '% of cap</div>';
    }
  } else {
    html += ' <span class="muted">(no cap)</span></div>';
  }
  if (mtd) {
    if (mtd.accrual_usd) html += '<div class="muted">+$' + Number(mtd.accrual_usd).toFixed(2) +
      ' accruing (in-flight / unbilled)</div>';
    if (mtd.as_of) html += '<div class="muted">as of ' + esc(String(mtd.as_of).replace('T', ' ')) + '</div>';
  }
  html += '<div class="lc-budgetrow" style="margin-top:6px">' +
    '<label class="muted" for="lc-budget">Monthly cap $</label>' +
    '<input id="lc-budget" class="lc-in" type="number" min="0" step="1" value="' + cap + '">' +
    '<button class="btn btn-sm" onclick="clSaveBudget()">save</button>' +
    '<span class="muted">0 = off</span></div>';
  // per-model rules
  var rules = d.rules || [];
  html += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bg-deep)">' +
    '<div class="kv" style="margin-bottom:6px"><b>Per-model rules</b></div>';
  if (rules.length) {
    html += '<table><thead><tr><th>model</th><th>est $/hr</th><th>idle</th>' +
      '<th>monthly cap $</th><th>auto-recover</th><th></th></tr></thead><tbody>';
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i] || {};
      var key = (r.backend || '') + '|' + (r.model || '');
      var idle = [];
      if (r.idle_stop_s > 0) idle.push('auto-stop ' + _fmtDur(r.idle_stop_s));
      if (r.idle_terminate_s > 0) idle.push('terminate ' + _fmtDur(r.idle_terminate_s));
      html += '<tr><td><b>' + esc(r.alias || r.model || '?') + '</b>' +
        '<div class="muted"><code>' + esc(key) + '</code></div></td>' +
        '<td class="muted">' + (r.est_cost_per_hr ? '$' + Number(r.est_cost_per_hr).toFixed(2) : '—') + '</td>' +
        '<td class="muted">' + (idle.length ? esc(idle.join(' · ')) : 'off') + '</td>' +
        '<td><input id="lc-cap-' + esc(key) + '" class="lc-in" type="number" min="0" step="1" value="' +
        (Number(r.monthly_budget_usd) || 0) + '"></td>' +
        '<td><select id="lc-rec-' + esc(key) + '" class="lc-in">' +
        '<option value="alert"' + (r.auto_recover !== 'redeploy' ? ' selected' : '') + '>Alert only</option>' +
        '<option value="redeploy"' + (r.auto_recover === 'redeploy' ? ' selected' : '') + '>Redeploy</option>' +
        '</select></td>' +
        '<td><button class="btn btn-sm" onclick="clSaveModelRules(\'' +
        esc(r.backend || '') + '\',\'' + esc(r.model || '') + '\')">save</button></td></tr>';
    }
    html += '</tbody></table>';
  } else {
    html += '<div class="muted">No lifecycle-managed models configured.</div>';
  }
  html += '</div>';
  // panic button
  html += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bg-deep);' +
    'display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
    '<button class="btn btn-danger-solid" onclick="clStopAllPods()">⛔ stop all pods</button>' +
    '<span class="muted">Stops every RUNNING pod on the account — pods stay resumable (not terminated). In-flight requests break.</span></div>';
  box.innerHTML = html;
}

// PANIC — raw fetch so 4xx/5xx error bodies survive; never terminate, only stop
function clStopAllPods() {
  if (!confirm('Stop every RUNNING pod? In-flight requests will break. Pods stay resumable (not terminated).')) return;
  var headers = {'Content-Type': 'application/json'};
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  fetch('/admin/runpod/stop-all', {method: 'POST', headers: headers})
    .then(function (r) {
      return r.json().then(
        function (d) { return {status: r.status, data: d}; },
        function () { return {status: r.status, data: null}; });
    })
    .then(function (res) {
      if (res.status === 200 && res.data) {
        notify('Stopped ' + ((res.data.stopped || []).length) + ' pod(s)');
        var errs = res.data.errors || [];
        for (var i = 0; i < errs.length; i++) {
          var e = errs[i] || {};
          notify('✗ ' + (e.pod_id || e.backend || 'pod') + ': ' + (e.error || 'stop failed'), true);
        }
      } else {
        var m = (res.data && res.data.error && res.data.error.message) || ('HTTP ' + res.status);
        notify('✗ stop-all failed — ' + m, true);
      }
      refreshRunpodPods();
      clPollLifecycle(); // the panic_stop alert lands in the banner
    })
    .catch(function (e) { notify('✗ stop-all failed — ' + e.message, true); });
}

// ----- boot watch modal (deploy / manual pod start) -----
// Opens over the page, polls /healthz + /admin/runpod/logs every 5 s while
// the pod boots, runs a chat test once the model reports running, then
// declares the server operational. Closing only stops polling — never the pod.
var _bw = null; // {backend, model, pod_id, pod_name, alias, t0, lastPoll,
                //  kind, warm_s, rawState, logs, logsPending, testing, tested,
                //  done, missing}

function bwOpenDeploy(d) {
  bwOpen({backend: (d && d.backend) || 'rp', model: (d && d.model) || '',
          pod_id: (d && d.pod_id) || '', pod_name: (d && d.name) || '',
          alias: (d && d.model) || ''});
}

// servers-widget "📡 watch" — called from an inline onclick string
function bwOpenFromPod(backend, model, podId, podName) {
  bwOpen({backend: backend || 'rp', model: model || podId || 'pod',
          pod_id: podId || '', pod_name: podName || '',
          alias: model || podId || 'pod'});
}

function bwOpen(o) {
  _bw = {backend: o.backend, model: o.model, pod_id: o.pod_id, pod_name: o.pod_name,
         alias: o.alias, t0: Date.now(), lastPoll: 0, kind: 'starting', warm_s: null,
         rawState: '', logs: [], logsPending: true, testing: false, tested: false,
         done: false, missing: 0};
  document.getElementById('bw-title').textContent =
    '🚀 Spinning up: ' + (_bw.alias || _bw.model || 'model');
  var sub = [];
  if (_bw.pod_name) sub.push('<code>' + esc(_bw.pod_name) + '</code>');
  if (_bw.pod_id) sub.push('<code>' + esc(_bw.pod_id) + '</code>');
  document.getElementById('bw-podline').innerHTML = sub.join(' · ') || '&nbsp;';
  document.getElementById('bw-banner').innerHTML = '';
  document.getElementById('bw-logs').innerHTML = '<div class="bw-waiting">waiting for pod logs…</div>';
  bwRenderState(0);
  document.getElementById('bw-overlay').classList.add('show');
  bwStartTimer();
}

function bwStartTimer() {
  bwStopTimer();
  if (_bw) _bw.lastPoll = 0;
  _bwTimer = setInterval(bwTick, 1000);
  bwTick();
}

function bwStopTimer() {
  if (_bwTimer) { clearInterval(_bwTimer); _bwTimer = null; }
}

// ✕ / Done — stops polling only; never touches the pod
function bwClose() {
  bwStopTimer();
  _bw = null;
  var ov = document.getElementById('bw-overlay');
  if (ov) ov.classList.remove('show');
}

function bwTick() {
  if (!_bw) { bwStopTimer(); return; }
  var el = Math.round((Date.now() - _bw.t0) / 1000);
  if (_bw.done) return; // final banner shown — timer is stopped anyway
  if (el >= 1200) { bwTimeout(); return; } // 20-minute polling budget
  bwRenderState(el);
  if (Date.now() - _bw.lastPoll < 4900) return;
  _bw.lastPoll = Date.now();
  bwPollHealth();
  bwPollLogs();
}

function bwTimeout() {
  _bw.done = true;
  bwStopTimer();
  bwSetChip('⏱ still warming', 'warm');
  document.getElementById('bw-elapsed').textContent =
    '⏱ ' + Math.round((Date.now() - _bw.t0) / 1000) + 's';
  document.getElementById('bw-banner').innerHTML =
    '<div class="muted" style="margin-top:12px">⏱ still warming — close and check the RunPod servers widget later (the pod keeps booting regardless of this window).</div>';
}

function bwSetChip(text, cls) {
  var chip = document.getElementById('bw-state');
  chip.className = 'bw-state' + (cls ? ' ' + cls : '');
  chip.textContent = text;
}

function bwRenderState(el) {
  if (!_bw) return;
  var kind = _bw.kind;
  if (kind === 'warming') {
    var s = _bw.warm_s != null ? Math.round(_bw.warm_s) : el;
    bwSetChip('🔥 warming up — building / downloading weights / loading model (' +
      (s != null ? s : 0) + 's elapsed)', 'warm');
  } else if (kind === 'testing') bwSetChip('🧪 testing…', '');
  else if (kind === 'testfail') bwSetChip('⚠ chat test failed', 'err');
  else if (kind === 'gone') bwSetChip('pod not found — deploy may have failed', 'err');
  else if (kind === 'other') bwSetChip('pod state: ' + (_bw.rawState || 'unknown') + '…', 'warm');
  else bwSetChip('⏳ starting pod…', '');
  if (el != null) document.getElementById('bw-elapsed').textContent = '⏱ ' + el + 's';
}

function bwFindStatus(h) {
  var rs = (h && h.runpod) || [];
  for (var i = 0; i < rs.length; i++) {
    var e = rs[i] || {};
    if (_bw.model && (e.model === _bw.model || e.alias === _bw.model)) return e;
    if (_bw.pod_id && e.pod_id && e.pod_id === _bw.pod_id) return e;
  }
  return null;
}

function bwPollHealth() {
  api('/healthz').then(function (h) {
    if (!_bw || _bw.done) return;
    var st = bwFindStatus(h);
    if (st) {
      _bw.missing = 0;
      if (st.alias) _bw.alias = st.alias;
      _bw.warm_s = (st.warm_s != null) ? st.warm_s : null;
      if (st.state === 'warming-up') _bw.kind = 'warming';
      else if (st.state === 'running') {
        if (_bw.testing) _bw.kind = 'testing';
        else if (_bw.tested) _bw.kind = 'testfail';
        else bwStartTest();
      } else if (st.state === 'not-deployed') _bw.kind = 'starting';
      else { _bw.kind = 'other'; _bw.rawState = st.state; }
    } else {
      _bw.warm_s = null;
      _bw.rawState = '';
      _bw.kind = 'starting';
      bwCheckInventory();
    }
    bwRenderState();
  }).catch(function () { /* transient poll error — keep waiting */ });
}

// healthz has no entry — is the pod at least in the RunPod inventory?
function bwCheckInventory() {
  api('/admin/runpod/inventory', {method: 'POST'}).then(function (inv) {
    if (!_bw || _bw.done) return;
    var found = false;
    ((inv && inv.pods) || []).forEach(function (p) {
      if (p && p.id === _bw.pod_id) found = true;
    });
    if (found) return; // pod exists, gateway not tracking it yet — keep "starting pod…"
    _bw.missing++;
    if (_bw.missing >= 3) {
      _bw.done = true;
      bwStopTimer();
      bwSetChip('pod not found — deploy may have failed', 'err');
      document.getElementById('bw-banner').innerHTML =
        '<div class="muted" style="margin-top:12px">The pod is not in the RunPod inventory and not in gateway health — it may have failed to deploy. Check the deploy result in the wizard or the RunPod servers widget.</div>';
    }
  }).catch(function () { /* inventory probe failed — keep current state */ });
}

function bwStartTest() {
  _bw.tested = true;
  _bw.testing = true;
  _bw.kind = 'testing';
  bwRenderState();
  api('/admin/runpod/test', {method: 'POST',
      body: {backend: _bw.backend, model: _bw.model, timeout_s: 180}})
    .then(function (d) { bwTestResult(d || {}); })
    .catch(function (e) { bwTestResult({ok: false, error: e.message}); });
}

function bwTestResult(d) {
  if (!_bw || _bw.done) return;
  _bw.testing = false;
  if ((d.logs || []).length) {
    _bw.logs = _bw.logs.concat(d.logs).slice(-150);
    _bw.logsPending = false;
    bwRenderLogs();
  }
  var chat = ((d.phases || {}).chat) || {};
  if (d.ok) {
    _bw.done = true;
    bwStopTimer();
    bwSetChip('✓ operational', 'ok');
    document.getElementById('bw-elapsed').textContent =
      '⏱ chat test passed in ' + (chat.elapsed_s != null ? chat.elapsed_s : '?') + 's';
    var url = location.origin + '/v1/chat/completions';
    document.getElementById('bw-banner').innerHTML =
      '<div class="bw-banner ok">✓ Server <b>' + esc(_bw.pod_name || _bw.pod_id || 'pod') +
      '</b> (model: <b>' + esc(_bw.alias) + '</b>) is operational' +
      (chat.content ? '<div class="bw-sub muted">chat reply (' +
        (chat.elapsed_s != null ? chat.elapsed_s + 's' : '?') + '): ' + esc(chat.content) + '</div>' : '') +
      '<div class="bw-sub">Use model "' + esc(_bw.alias) +
      '" in any OpenAI- or Anthropic-compatible tool → <code>' + esc(url) + '</code></div>' +
      '<div style="margin-top:10px"><button class="btn btn-primary" onclick="bwClose()">Done</button></div></div>';
    refreshRunpodPods();
  } else {
    var msg = d.error || chat.error || 'chat test failed';
    _bw.kind = 'testfail';
    bwRenderState();
    document.getElementById('bw-banner').innerHTML =
      '<div class="bw-banner warn">⚠ Server running but the chat test failed: ' + esc(msg) +
      '<div class="bw-sub">Check the log tail below. ' +
      '<button class="btn btn-sm" onclick="bwRetryTest()" style="margin-left:6px">↻ retry test</button></div></div>';
  }
}

function bwRetryTest() {
  if (!_bw || _bw.done) return;
  _bw.tested = false;
  _bw.testing = false;
  document.getElementById('bw-banner').innerHTML = '';
  bwRenderState();
}

function bwPollLogs() {
  var headers = {'Content-Type': 'application/json'};
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  fetch('/admin/runpod/logs', {method: 'POST', headers: headers,
      body: JSON.stringify({backend: _bw.backend, pod_id: _bw.pod_id,
                            model: _bw.model, tail: 120})})
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!_bw || _bw.done) return;
      if (!d) { _bw.logsPending = true; bwRenderLogs(); return; } // 4xx/5xx — keep waiting
      _bw.logsPending = false;
      _bw.logs = (d.lines || []).slice(-150);
      bwRenderLogs();
    })
    .catch(function () {
      if (_bw && !_bw.done) { _bw.logsPending = true; bwRenderLogs(); }
    });
}

function bwRenderLogs() {
  var box = document.getElementById('bw-logs');
  if (!box || !_bw) return;
  if (_bw.logsPending && !_bw.logs.length) {
    box.innerHTML = '<div class="bw-waiting">waiting for pod logs…</div>';
    return;
  }
  var nearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  var prevTop = box.scrollTop;
  var lines = _bw.logs.slice(-150);
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i] || {};
    var text = String(l.line == null ? '' : l.line);
    var mark = /^\[(boot|build|model)\]/.test(text);
    html += '<div class="bw-log' + (mark ? ' bw-mark' : '') + '">' +
      '<span class="bw-ts">' + esc(l.ts || '') + '</span>' + esc(text) + '</div>';
  }
  if (!lines.length) html = '<div class="bw-waiting">no log lines yet…</div>';
  box.innerHTML = html;
  box.scrollTop = nearBottom ? box.scrollHeight : prevTop;
}

// ---------- Performance ----------
function showPerf(ui) {
  ui.title.textContent = '📊 Performance';
  var render = function () {
    Promise.all([api('/healthz'), api('/admin/stats')]).then(function (r) {
      var hz = r[0], st = r[1];
      var html = '';
      (hz.gpus || []).forEach(function (g) {
        var used = g.total_mb - g.free_mb, pct = Math.round(used / g.total_mb * 100);
        var cls = pct > 90 ? 'err' : pct > 70 ? 'warn' : '';
        html += '<div class="widget"><h3>' + esc(g.name) + '</h3>' +
          '<div class="bar"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
          '<div class="kv" style="margin-top:4px;"><b>' + fmtMB(used) + '</b> used · <b>' +
          fmtMB(g.free_mb) + '</b> free of ' + fmtMB(g.total_mb) + ' (' + pct + '%)</div></div>';
      });
      html += '<div class="widget"><h3>Per-model (' + esc(st.total) + ' logged requests)</h3>';
      if (!(st.per_model || []).length) html += '<div class="muted">No requests logged yet.</div>';
      else {
        html += '<table><thead><tr><th>model</th><th>backend</th><th class="num">n</th>' +
          '<th class="num">avg ms</th><th class="num">max ms</th><th class="num">tokens</th>' +
          '<th class="num">errors</th></tr></thead><tbody>';
        st.per_model.forEach(function (m) {
          html += '<tr><td><b>' + esc(m.model) + '</b></td><td>' + esc(m.backend) + '</td>' +
            '<td class="num">' + m.n + '</td><td class="num">' + m.avg_ms + '</td>' +
            '<td class="num">' + m.max_ms + '</td><td class="num">' + m.total_tokens + '</td>' +
            '<td class="num">' + (m.errors ? '<span style="color:var(--danger)">' + m.errors + '</span>' : '0') + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      html += '</div><div class="widget"><h3>Recent requests</h3><table><tbody>';
      (st.recent || []).slice(-15).reverse().forEach(function (e) {
        var col = e.status >= 400 ? 'var(--danger)' : 'var(--text-dim)';
        html += '<tr><td class="muted">' + esc(e.ts) + '</td><td><b>' + esc(e.model) + '</b></td>' +
          '<td>' + esc(e.backend || '—') + '</td><td>' + (e.stream ? 'stream' : 'chat') + '</td>' +
          '<td class="num">' + e.ms + 'ms</td><td style="color:' + col + '">' + e.status + '</td></tr>';
      });
      html += '</tbody></table></div>';
      html += buildBenchmarkWidget();
      ui.body.innerHTML = html;
    }).catch(function (e) { ui.body.innerHTML = errBox(e); });
  };
  render();
  _perfTimer = setInterval(render, 5000);
}

function buildBenchmarkWidget() {
  var html = '<div class="widget"><h3>Benchmark</h3>';
  html += '<div class="srow"><label>Model</label><input id="bm-model" placeholder="model alias" style="flex:1;min-width:260px"></div>';
  html += '<div class="srow"><label>Base URL</label><input id="bm-base_url" placeholder="(empty = gateway self)" style="flex:1;min-width:260px"></div>';
  html += '<div class="srow"><label>API Key</label><input id="bm-api_key" type="password" placeholder="(optional)" style="flex:1;min-width:260px"></div>';
  html += '<div class="srow"><label>Prompt</label><input id="bm-prompt" placeholder="Explain quantum computing in simple terms." style="flex:1;min-width:260px"></div>';
  html += '<div class="srow"><label>Iterations</label><input id="bm-n" type="number" min="1" value="1" style="width:80px"></div>';
  html += '<div class="srow"><label>Max tokens</label><input id="bm-max_tokens" type="number" min="1" value="256" style="width:80px"></div>';
  html += '<div class="srow"><label>Stream</label><select id="bm-stream"><option value="0">No</option><option value="1">Yes (measures TTFT)</option></select></div>';
  html += '<div style="margin-top:10px;"><button class="btn btn-primary" onclick="runBenchmark()">Run</button></div>';
  html += '<div id="bm-results" style="margin-top:10px;"></div>';
  html += '</div>';
  return html;
}

function runBenchmark() {
  var model = document.getElementById('bm-model').value.trim();
  if (!model) { notify('✗ Model is required', true); return; }
  var payload = {
    model: model,
    base_url: document.getElementById('bm-base_url').value.trim(),
    api_key: document.getElementById('bm-api_key').value,
    prompt: document.getElementById('bm-prompt').value.trim() || "Explain quantum computing in simple terms.",
    n: parseInt(document.getElementById('bm-n').value) || 1,
    max_tokens: parseInt(document.getElementById('bm-max_tokens').value) || 256,
    stream: document.getElementById('bm-stream').value === '1',
  };
  document.getElementById('bm-results').innerHTML = '<div class="loading">Running benchmark…</div>';
  api('/admin/benchmark', {method: 'POST', body: payload})
    .then(function (d) {
      var html = '';
      if (d.aggregate) {
        html += '<div class="kv"><b>Avg latency:</b> ' + d.aggregate.avg_total_ms + 'ms · ' +
          '<b>TTFT:</b> ' + d.aggregate.avg_ttft_ms + 'ms · ' +
          '<b>Tok/s:</b> ' + d.aggregate.avg_tok_per_s + '</div>';
        html += '<div class="kv muted">Range: ' + d.aggregate.min_total_ms + ' – ' + d.aggregate.max_total_ms + 'ms</div>';
      }
      if (d.results && d.results.length) {
        html += '<table style="margin-top:8px;"><thead><tr><th>#</th><th>ms</th><th>TTFT</th><th>tok/s</th><th>tokens</th></tr></thead><tbody>';
        d.results.forEach(function (r) {
          html += '<tr><td>' + r.iteration + '</td><td class="num">' + r.total_ms + '</td>' +
            '<td class="num">' + (r.ttft_ms != null ? r.ttft_ms : '—') + '</td>' +
            '<td class="num">' + (r.tok_per_s != null ? r.tok_per_s : '—') + '</td>' +
            '<td class="num">' + (r.tokens || 0) + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      document.getElementById('bm-results').innerHTML = html;
    })
    .catch(function (e) {
      document.getElementById('bm-results').innerHTML = '<div style="color:var(--danger)">✗ ' + esc(e.message) + '</div>';
    });
}

// ---------- Syslog ----------
function showSyslog(ui) {
  ui.title.textContent = '📋 Syslog';
  var render = function () {
    api('/admin/events').then(function (r) {
      var html = '<div class="logs">';
      (r.events || []).forEach(function (e) {
        html += '<div class="log-entry"><span class="log-time">' + esc(e.ts) + '</span> ' +
          '<span class="log-level ' + esc(e.level) + '">' + esc(e.level) + '</span> ' +
          '<span class="log-msg">' + esc(e.message) + '</span></div>';
      });
      if (!(r.events || []).length) html += '<div class="muted">No events yet.</div>';
      html += '</div><div class="muted" style="margin-top:6px">Live — refreshes every 4s. Ring keeps the last 300 events.</div>';
      ui.body.innerHTML = html;
      var logs = ui.body.querySelector('.logs');
      if (logs) logs.scrollTop = logs.scrollHeight;
    }).catch(function (e) { ui.body.innerHTML = errBox(e); });
  };
  render();
  _syslogTimer = setInterval(render, 4000);
}

// ---------- Parameters ----------
function showParams(ui) {
  ui.title.textContent = '⚙️ Setup Parameters';
  api('/admin/backends').then(function (d) {
    var html = '';
    // Server settings
    html += '<div class="widget"><h3>Server</h3>' +
      '<div class="srow"><label>Bind address</label>' +
      '<input id="pm-bind" type="text" value="' + esc(d.bind) + '"></div>' +
      '<div class="srow"><label>Port</label>' +
      '<input id="pm-port" type="number" value="' + esc(d.port) + '"></div>' +
      '<div class="srow"><label>Models directory</label>' +
      '<input id="pm-models-dir" type="text" value="' + esc(d.models_dir) + '"></div>' +
      '<div class="srow"><label>Default alias</label>' +
      '<input id="pm-default-alias" type="text" value="' + esc(d.default_alias || '') +
      '" placeholder="(none — model= required)"></div></div>';
    // Queue settings
    html += '<div class="widget"><h3>Queue</h3>' +
      '<div class="srow"><label>Max waiting</label>' +
      '<input id="pm-q-max" type="number" value="' + esc((d.queue || {}).max_waiting) + '"></div>' +
      '<div class="srow"><label>Timeout (seconds)</label>' +
      '<input id="pm-q-timeout" type="number" value="' + esc((d.queue || {}).timeout_s) + '"></div>' +
      '<div style="margin-top:10px;display:flex;gap:8px;">' +
      '<button class="btn btn-primary" onclick="saveParams()">Save &amp; apply</button>' +
      '<button class="btn" onclick="reloadConfig()">↻ Reload from disk</button>' +
      '</div></div>';
    // Gateway keys
    html += '<div class="widget"><h3>Gateway access keys</h3>';
    html += d.gateway_keys_configured
      ? '<div class="kv"><span class="badge ok">secured</span> Bearer auth active</div>'
      : '<div class="kv"><span class="badge warn">open</span> No keys — trusts localhost</div>';
    html += '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
      '<input id="pm-key-input" type="text" placeholder="Add key…" style="width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;font-family:inherit;">' +
      '<button class="btn btn-sm btn-primary" onclick="addGatewayKey()">Add</button></div>';
    // Show existing keys
    api('/admin/config').then(function (c) {
      try {
        var cfg = JSON.parse(c.text);
        var keys = cfg.gateway_keys || [];
        if (keys.length) {
          html += '<div style="margin-top:8px;"><table><thead><tr><th>Key</th><th>Action</th></tr></thead><tbody>';
          keys.forEach(function (k) {
            var masked = k.substring(0, 4) + '••••' + k.substring(k.length - 4);
            html += '<tr><td><code>' + esc(masked) + '</code></td>' +
              '<td><button class="btn btn-sm btn-danger" onclick="removeGatewayKey(\'' + esc(k) + '\')">remove</button></td></tr>';
          });
          html += '</tbody></table></div>';
        }
      } catch (e) { /* ignore parse error */ }
      // Inject keys table into the widget
      var widgetEls = document.querySelectorAll('.widget');
      if (widgetEls.length >= 3) {
        // Already built, append to last widget
      }
    });
    html += '<div class="muted" style="margin-top:6px">Keys are stored in the config file — restart the gateway or reload to apply.</div></div>';
    // Raw config (collapsible)
    html += '<div class="widget"><h3 style="cursor:pointer;" onclick="toggleRawConfig()">Raw config JSON <span class="muted" id="raw-toggle">[click to expand]</span></h3>' +
      '<div id="raw-config-section" style="display:none;margin-top:8px;">' +
      '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
      '<button class="btn btn-sm btn-primary" onclick="saveRawConfig()">Save raw JSON</button></div>' +
      '<textarea id="cfg-raw" spellcheck="false"></textarea>' +
      '<div class="muted" style="margin-top:4px">Broken JSON is rejected — last good config keeps serving.</div></div></div>';
    ui.body.innerHTML = html;
    // Load raw config
    api('/admin/config').then(function (c) {
      document.getElementById('cfg-raw').value = c.text;
    });
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}
function toggleRawConfig() {
  var section = document.getElementById('raw-config-section');
  var toggle = document.getElementById('raw-toggle');
  if (section.style.display === 'none') {
    section.style.display = 'block';
    toggle.textContent = '[click to collapse]';
  } else {
    section.style.display = 'none';
    toggle.textContent = '[click to expand]';
  }
}
function saveParams() {
  var body = {
    bind: document.getElementById('pm-bind').value.trim(),
    port: parseInt(document.getElementById('pm-port').value) || 8010,
    models_dir: document.getElementById('pm-models-dir').value.trim(),
    default_alias: document.getElementById('pm-default-alias').value.trim(),
    queue_max_waiting: parseInt(document.getElementById('pm-q-max').value) || 4,
    queue_timeout_s: parseFloat(document.getElementById('pm-q-timeout').value) || 120
  };
  api('/admin/params', {method: 'PUT', body: body})
    .then(function () { notify('✓ parameters saved + applied'); refreshHeader(); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function saveRawConfig() {
  var text = document.getElementById('cfg-raw').value;
  api('/admin/config', {method: 'PUT', body: {text: text}})
    .then(function () { notify('✓ config saved + applied'); refreshHeader(); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function reloadConfig() {
  api('/admin/reload', {method: 'POST'})
    .then(function () { notify('✓ reloaded'); showPanel('params'); refreshHeader(); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function addGatewayKey() {
  var input = document.getElementById('pm-key-input');
  var key = input.value.trim();
  if (!key) { notify('Enter a key value', true); return; }
  api('/admin/gateway-keys', {method: 'POST', body: {key: key}})
    .then(function () { notify('✓ key added'); input.value = ''; showPanel('params'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function removeGatewayKey(key) {
  if (!confirm('Remove gateway key ' + key.substring(0, 8) + '…?')) return;
  api('/admin/gateway-keys', {method: 'POST', body: {key: key, delete: true}})
    .then(function () { notify('✓ key removed'); showPanel('params'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}

// ---------- API Keys ----------
function showKeys(ui) {
  ui.title.textContent = '🔑 API Keys & Connections';
  // Fetch both secrets and backends data
  Promise.all([api('/admin/secrets'), api('/admin/backends')]).then(function (results) {
    var secrets = results[0];
    var backends = results[1];
    var html = '';
    // Gateway access section
    html += '<div class="widget"><h3>Gateway access (bearer keys)</h3>';
    html += secrets.gateway_keys_configured
      ? '<div class="kv"><span class="badge ok">secured</span> Requests need <b>Authorization: Bearer &lt;key&gt;</b></div>'
      : '<div class="kv"><span class="badge warn">open</span> No gateway_keys configured — trusts localhost. Add keys via <b>Parameters → Gateway access keys</b>.</div>';
    html += '</div>';
    // Backend service credentials
    html += '<div class="widget"><h3>Backend service credentials</h3>';
    if (!(secrets.api_keys || []).length)
      html += '<div class="muted">No cloud/runpod backends configured — nothing needs keys.</div>';
    else {
      html += '<table><thead><tr><th>Environment variable</th><th>Used by backends</th><th>Status</th></tr></thead><tbody>';
      secrets.api_keys.forEach(function (k) {
        var badge = k.source === 'env' ? '<span class="badge ok">env</span>'
          : k.source === 'keyring' ? '<span class="badge ok">keyring</span>'
          : '<span class="badge err">missing</span>';
        html += '<tr><td><code>' + esc(k.name) + '</code></td><td>' +
          k.backends.map(esc).join(', ') + '</td><td>' + badge + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div class="muted" style="margin-top:10px">' + esc(secrets.hint) + '</div></div>';
    // How to set keys
    html += '<div class="widget"><h3>Setting API keys</h3>' +
      '<div class="kv"><b>Option 1 — Environment variable</b></div>' +
      '<div class="muted">Set the env var before starting the gateway (e.g., <code>set GROQ_API_KEY=your_key</code> on Windows).</div>' +
      '<div class="kv" style="margin-top:6px;"><b>Option 2 — OS Keyring</b></div>' +
      '<div class="muted">Store in the OS keyring: service = <code>Workshop</code>, username = env var name (e.g., <code>RUNPOD_API_KEY</code>). The gateway reads from keyring at boot — restart after adding.</div>' +
      '<div class="kv" style="margin-top:6px;"><b>Option 3 — Workshop secret</b></div>' +
      '<div class="muted">Use the Workshop platform to store secrets. The gateway bridges Workshop keyring at startup.</div></div>';
    ui.body.innerHTML = html;
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}

// ---------- Health & Recovery ----------
function showHealth(ui) {
  ui.title.textContent = '🩺 Health & Recovery';
  api('/healthz').then(function (h) {
    var html = '<div class="widget"><h3>Status</h3>' +
      '<div class="kv">version <b>' + esc(h.version) + '</b> · bind <b>' + esc(h.bind) + ':' + h.port + '</b></div>' +
      '<div class="kv"><b>' + h.loaded_count + '</b> loaded instances · <b>' + h.discovered_models + '</b> GGUFs on disk</div>';
    Object.keys(h.backends || {}).forEach(function (n) {
      var b = h.backends[n];
      html += '<div class="kv">· <span class="badge ' + esc(b.type) + '">' + esc(n) + '</span> ' +
        b.configured_models + ' model(s)</div>';
    });
    html += '</div>';
    (h.gpus || []).forEach(function (g) {
      var used = g.total_mb - g.free_mb, pct = Math.round(used / g.total_mb * 100);
      var cls = pct > 90 ? 'err' : pct > 70 ? 'warn' : '';
      html += '<div class="widget"><h3>' + esc(g.name) + '</h3>' +
        '<div class="bar"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
        '<div class="kv" style="margin-top:4px;"><b>' + fmtMB(used) + '</b> used · <b>' + fmtMB(g.free_mb) + '</b> free (' + pct + '%)</div></div>';
    });
    var children = h.llama_server || [];
    if (children.length) {
      html += '<div class="widget"><h3>llama-server children (' + children.length + ')</h3><table><tbody>';
      children.forEach(function (c) {
        html += '<tr><td><b>' + esc(c.backend) + ':' + esc(c.model) + '</b></td><td>' + esc(c.state) +
          '</td><td><button class="btn btn-sm btn-danger" onclick="stopChild(\'' + esc(c.backend) + '\',\'' + esc(c.model) + '\')">stop</button></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += buildRunpodServers();
    html += '<div class="widget"><h3>Recovery actions</h3><div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn" onclick="unloadAll()">⏏ Unload all embedded models</button>' +
      '<button class="btn" onclick="stopAllChildren()">■ Stop all llama-server children</button>' +
      '<button class="btn" onclick="reloadConfig()">↻ Reload config</button></div>' +
      '<div class="muted" style="margin-top:6px">Everything respawns lazily — unloading/stopping only frees resources until the next request.</div></div>';
    ui.body.innerHTML = html;
    refreshRunpodPods();
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}
function unloadAll() {
  api('/admin/unload', {method: 'POST', body: {all: true}})
    .then(function (r) { notify('✓ unloaded ' + r.unloaded); showPanel('health'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function stopAllChildren() {
  api('/admin/llama-server/stop', {method: 'POST', body: {all: true}})
    .then(function () { notify('✓ all children stopped'); showPanel('health'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}

// ---------- Aliases ----------
function showAliases(ui) {
  ui.title.textContent = '🧭 Aliases';
  api('/admin/aliases').then(function (d) {
    var html = '<div class="widget"><h3>Define alias</h3>' +
      '<div class="srow"><label>name</label><input id="al-name" placeholder="smart"></div>' +
      '<div class="srow"><label>chain (backend:model, …)</label><input id="al-chain" placeholder="local:big, groq:cloud-fast" style="flex:1;min-width:260px"></div>' +
      '<div class="srow"><label>hedge_s (0 = sequential)</label><input id="al-hedge" type="number" min="0" step="0.5" value="0"></div>' +
      '<div class="srow"><label>local_only</label><input id="al-local" type="checkbox"></div>' +
      '<button class="btn btn-primary" onclick="upsertAlias()">Upsert</button></div>' +
      '<div class="widget"><h3>Existing</h3><table><thead><tr><th>alias</th><th>chain</th><th class="num">hedge_s</th><th>local_only</th><th></th></tr></thead><tbody>';
    Object.keys(d.aliases || {}).forEach(function (n) {
      var a = d.aliases[n];
      html += '<tr><td><b>' + esc(n) + '</b></td><td>' + esc((a.chain || []).join(' → ')) + '</td>' +
        '<td class="num">' + (a.hedge_s || 0) + '</td><td>' + (a.local_only ? '✓' : '') + '</td>' +
        '<td><button class="btn btn-sm btn-danger" onclick="delAlias(\'' + esc(n) + '\')">delete</button></td></tr>';
    });
    if (!Object.keys(d.aliases || {}).length)
      html += '<tr><td colspan="5" class="muted">No aliases — requests use backend:model or bare model names.</td></tr>';
    html += '</tbody></table><div class="muted" style="margin-top:6px">Hedge: the primary answers within hedge_s or the next entry races it — first completion wins.</div></div>';
    ui.body.innerHTML = html;
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}
function upsertAlias() {
  api('/admin/aliases', {method: 'POST', body: {
    name: document.getElementById('al-name').value,
    chain: document.getElementById('al-chain').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
    hedge_s: parseFloat(document.getElementById('al-hedge').value) || 0,
    local_only: document.getElementById('al-local').checked}})
    .then(function () { notify('✓ alias saved'); showPanel('aliases'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function delAlias(name) {
  api('/admin/aliases', {method: 'POST', body: {name: name, delete: true}})
    .then(function () { notify('✓ deleted'); showPanel('aliases'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}

function errBox(e) { return '<div style="color:var(--danger);padding:12px;">✗ ' + esc(e.message) + '</div>'; }

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
boot();
</script>
