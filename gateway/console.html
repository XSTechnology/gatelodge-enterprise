<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f12">
<title>LLM Gateway Admin</title>
<style>
:root {
  --bg: #f0f2f5; --bg-deep: #e8ebf0; --card: #ffffff; --card-hover: #f5f7fa;
  --border: #d0d5dd; --text: #1a1a2e; --text-dim: #555; --text-faint: #888;
  --primary: #2563eb; --primary-soft: rgba(37,99,235,.1);
  --warning: #d97706; --danger: #dc2626; --success: #16a34a;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,.08);
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh; padding:20px;
  background-image:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(37,99,235,.05),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(37,99,235,.03),transparent);
  background-attachment:fixed; -webkit-font-smoothing:antialiased; }
.header { display:flex; align-items:center; gap:10px; margin-bottom:8px; max-width:860px; margin-left:auto; margin-right:auto; }
.header h1 { font-size:1.3rem; font-weight:600; color:var(--primary); }
.header .spacer { flex:1; }
#conn { font-size:.78rem; color:var(--text-faint); }
#conn.ok { color:var(--success); } #conn.bad { color:var(--danger); }
#key { padding:6px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--card); color:var(--text); font-size:.82rem; width:180px; font-family:inherit; }
#key:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
.subheader { max-width:860px; margin:0 auto 16px; font-size:.8rem; color:var(--text-dim);
  display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
.subheader b { color:var(--text); }
.settings-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; max-width:860px; margin:0 auto; }
.cat-btn { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px;
  border:1px solid var(--border); background:var(--card); color:var(--text-dim); font-size:.8rem;
  font-weight:500; cursor:pointer; border-radius:var(--radius); transition:var(--transition);
  font-family:inherit; text-align:center; }
.cat-btn:hover { color:var(--text); background:var(--primary-soft); border-color:var(--primary); transform:translateY(-1px); }
.cat-btn:active { transform:scale(.97); }
.cat-btn .cat-icon { font-size:1.6rem; line-height:1; }
.cat-btn.dashed { border-style:dashed; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:2000; padding:20px; }
.modal-overlay.show { display:flex; animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background:var(--card); border-radius:var(--radius); padding:24px; width:100%; max-width:860px;
  box-shadow:var(--shadow); border:1px solid var(--border); max-height:90vh; overflow-y:auto;
  scrollbar-width:thin; }
.modal::-webkit-scrollbar { width:6px; } .modal::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.modal-title { font-size:1.2rem; font-weight:600; margin-bottom:14px; color:var(--primary); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
.btn { padding:8px 20px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:.9rem;
  cursor:pointer; font-family:inherit; background:var(--card); color:var(--text); transition:var(--transition); }
.btn:hover { border-color:var(--primary); color:var(--primary); }
.btn:active { transform:scale(.97); }
.btn-sm { padding:4px 12px; font-size:.78rem; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { filter:brightness(1.1); color:#fff; }
.btn-danger:hover { border-color:var(--danger); color:var(--danger); }
table { width:100%; border-collapse:collapse; font-size:.82rem; }
th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--bg-deep); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:260px; }
th { color:var(--text-faint); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; }
td.num, th.num { text-align:right; }
.badge { display:inline-block; font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:6px;
  color:#fff; vertical-align:middle; }
.badge.embedded { background:#2e7d32; } .badge.llama-server { background:#1565c0; }
.badge.runpod { background:#7b1fa2; } .badge.runpod-public { background:#6a1b9a; } .badge.openai { background:#e65100; }
.badge.ok { background:var(--success); } .badge.warn { background:var(--warning); }
.badge.err { background:var(--danger); } .badge.dim { background:#9e9e9e; }
.widget { padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:12px; }
.widget h3 { font-size:.85rem; margin-bottom:8px; color:var(--text); }
.bar { height:18px; background:var(--border); border-radius:9px; overflow:hidden; }
.bar-fill { height:100%; width:0%; border-radius:9px; background:linear-gradient(90deg,#4CAF50,#66BB6A); transition:width .5s; }
.bar-fill.warn { background:linear-gradient(90deg,#FFA726,#FB8C00); }
.bar-fill.err { background:linear-gradient(90deg,#EF5350,#E53935); }
.logs { max-height:56vh; overflow-y:auto; font-family:'Cascadia Code',Consolas,monospace; font-size:.78rem;
  line-height:1.5; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; }
.log-entry { padding:1px 0; } .log-time { color:var(--text-faint); }
.log-level { font-weight:600; }
.log-level.INFO { color:var(--text-dim); } .log-level.WARNING { color:var(--warning); }
.log-level.ERROR { color:var(--danger); } .log-msg { color:var(--text); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.chip { border:1px solid var(--border); border-radius:999px; padding:3px 12px; font-size:.75rem;
  display:inline-flex; gap:8px; align-items:center; background:var(--card); }
.chip .muted { color:var(--text-faint); font-size:.68rem; }
.chip button { border:none; background:none; cursor:pointer; color:var(--primary); font-size:.72rem; padding:0; font-family:inherit; }
.chip button:hover { text-decoration:underline; }
.srow { display:flex; align-items:center; gap:8px; margin-bottom:6px; padding:4px 0; flex-wrap:wrap; }
.srow label { flex:1; font-size:.85rem; color:var(--text-dim); min-width:140px; }
.srow input, .srow select { width:220px; padding:6px 10px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-size:.85rem; font-family:inherit; }
.srow input:focus, .srow select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
.srow .info-value { font-size:.82rem; color:var(--text-faint); font-style:italic; }
#cfg-raw { width:100%; height:260px; font:12px/1.4 Consolas,monospace; white-space:pre; resize:vertical;
  border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); padding:10px; }
.notif { position:fixed; top:20px; right:20px; z-index:3000; background:var(--success); color:#000;
  padding:10px 16px; border-radius:var(--radius-sm); font-size:.85rem; font-weight:600;
  box-shadow:var(--shadow); animation:slideIn .3s ease; max-width:350px; }
.notif.error { background:var(--danger); color:#fff; }
@keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
.loading { text-align:center; padding:40px; color:var(--text-faint); font-size:.9rem; }
.svc-card { border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; background:var(--bg); }
.svc-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.svc-head b { font-size:.95rem; }
.svc-params { font-size:.75rem; color:var(--text-dim); margin-bottom:6px; font-family:Consolas,monospace; }
.svc-models { font-size:.78rem; color:var(--text-dim); }
.kv { font-size:.78rem; color:var(--text-dim); margin:2px 0; }
.kv b { color:var(--text); font-weight:600; }
.muted { color:var(--text-faint); font-size:.75rem; }
@media (max-width:600px){ body{padding:12px} .settings-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .cat-btn{padding:12px 6px;font-size:.75rem} .modal{padding:16px} }
</style>
</head>
<body>

<div class="header">
  <h1>🧠 LLM Gateway Admin</h1>
  <span class="spacer"></span>
  <span id="conn">connecting…</span>
  <input id="key" type="password" placeholder="API key (blank = open)" style="display:none">
</div>
<div class="subheader" id="subheader">
  <span id="sh-version"></span> <span id="sh-backends"></span>
  <span id="sh-models"></span> <span id="sh-gpus"></span>
</div>

<div class="settings-grid" id="grid">
  <button class="cat-btn" onclick="showPanel('models')" title="Loaded instances, worker pools, on-disk GGUFs, load/unload">
    <span class="cat-icon">🧠</span><span>Models</span></button>
  <button class="cat-btn" onclick="showPanel('services')" title="Backend service definitions: connection params, models, live children & pods">
    <span class="cat-icon">🔌</span><span>Services</span></button>
  <button class="cat-btn" onclick="showPanel('perf')" title="GPU memory, per-model latency/token stats, recent requests">
    <span class="cat-icon">📊</span><span>Performance</span></button>
  <button class="cat-btn dashed" onclick="showPanel('syslog')" title="Live gateway log events">
    <span class="cat-icon">📋</span><span>Syslog</span></button>
  <button class="cat-btn" onclick="showPanel('params')" title="Port, bind, queue, models_dir, gateway keys + raw config JSON">
    <span class="cat-icon">⚙️</span><span>Parameters</span></button>
  <button class="cat-btn" onclick="showPanel('keys')" title="API key status per backend (env / keyring / missing)">
    <span class="cat-icon">🔑</span><span>API Keys</span></button>
  <button class="cat-btn" onclick="showPanel('health')" title="Health overview + recovery: stop children, stop pods, unload all, reload config">
    <span class="cat-icon">🩺</span><span>Health &amp; Recovery</span></button>
  <button class="cat-btn" onclick="showPanel('aliases')" title="Alias chains with hedge racing">
    <span class="cat-icon">🧭</span><span>Aliases</span></button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
'use strict';
var KEY = localStorage.getItem('gw_key') || '';
var _syslogTimer = null, _perfTimer = null;

// ---------- api ----------
function api(path, opts) {
  opts = opts || {};
  var headers = opts.headers || {};
  headers['Content-Type'] = 'application/json';
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  return fetch(path, {method: opts.method || 'GET', headers: headers,
                      body: opts.body ? JSON.stringify(opts.body) : undefined})
    .then(function (r) {
      if (r.status === 401) { setConn('bad', '401 — wrong API key'); throw new Error('401 unauthorized'); }
      if (!r.ok) return r.json().then(function (b) {
        throw new Error((b && b.error && b.error.message) || ('HTTP ' + r.status));
      });
      return r.json();
    });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setConn(cls, txt) { var el = document.getElementById('conn');
  el.className = cls || ''; el.textContent = txt; }
function notify(msg, isErr) {
  var d = document.createElement('div');
  d.className = 'notif' + (isErr ? ' error' : '');
  d.textContent = msg; document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 3200);
}
function fmtMB(mb) { return mb >= 1024 ? (mb/1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB'; }

// ---------- boot ----------
function boot() {
  var keyEl = document.getElementById('key');
  keyEl.style.display = '';
  keyEl.value = KEY;
  keyEl.addEventListener('change', function () {
    KEY = keyEl.value.trim(); localStorage.setItem('gw_key', KEY); refreshHeader();
  });
  refreshHeader();
  setInterval(refreshHeader, 15000);
}
function refreshHeader() {
  api('/healthz').then(function (h) {
    setConn('ok', '● connected');
    document.getElementById('sh-version').innerHTML = '<b>' + esc(h.version) + '</b>';
    var types = Object.keys(h.backends || {}).map(function (n) {
      return '<span class="badge ' + esc(h.backends[n].type) + '">' + esc(n) + '</span>'; }).join(' ');
    document.getElementById('sh-backends').innerHTML = types;
    document.getElementById('sh-models').textContent =
      h.loaded_count + ' loaded · ' + h.discovered_models + ' on disk';
    var g = (h.gpus || [])[0];
    document.getElementById('sh-gpus').textContent = g
      ? (g.name + ' · ' + fmtMB(g.free_mb) + ' free') : '';
  }).catch(function (e) { setConn('bad', '✗ ' + e.message); });
}

// ---------- modal ----------
function showPanel(name) {
  document.getElementById('modal').classList.add('show');
  stopTimers();
  var t = document.getElementById('modal-title'), b = document.getElementById('modal-body');
  b.innerHTML = '<div class="loading">Loading…</div>';
  ({models: showModels, services: showServices, perf: showPerf,
    syslog: showSyslog, params: showParams, keys: showKeys,
    health: showHealth, aliases: showAliases}[name] || function(){})(
      {title: t, body: b});
}
function closeModal() {
  document.getElementById('modal').classList.remove('show'); stopTimers();
}
function stopTimers() {
  if (_syslogTimer) { clearInterval(_syslogTimer); _syslogTimer = null; }
  if (_perfTimer) { clearInterval(_perfTimer); _perfTimer = null; }
}

// ---------- Models ----------
var _editModelName = null; // tracks which model we're editing
function showModels(ui) {
  ui.title.textContent = '🧠 Models';
  _editModelName = null;
  Promise.all([api('/admin/models'), api('/admin/backends')]).then(function (r) {
    var d = r[0], defs = r[1];
    // Store backend info for form rendering
    _modelBackends = {};
    (defs.backends || []).forEach(function (b) {
      _modelBackends[b.name] = {type: b.type, mode: b.mode};
    });
    var configured = {}; // name -> {backend, role, cfg}
    (defs.backends || []).forEach(function (b) {
      var mm = Object.assign({}, b.models || {}, b.embedding_models || {});
      Object.keys(mm).forEach(function (n) {
        configured[n] = {backend: b.name, role: (b.embedding_models && b.embedding_models[n]) ? 'embed' : 'chat', cfg: mm[n], btype: b.type, bmode: b.mode};
      });
    });
    _configuredModels = configured;
    var html = buildModelForm(defs, d.discovered || []) +
      buildConfiguredTable(configured, d) +
      buildLoadedTable(d.loaded || []) +
      buildDiscoveredChips(d.discovered || [], configured) +
      buildDownloadWidget();
    ui.body.innerHTML = html;
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}

function buildModelForm(defs, discovered) {
  var backends = defs.backends || [];
  var ggufNames = (discovered || []).map(function (g) { return g.name; });
  var html = '<div class="widget"><h3>' + (_editModelName ? 'Edit model' : 'Add / Edit model') + '</h3>';
  // Name
  html += '<div class="srow"><label>Name</label><input id="m-name" placeholder="my-model"></div>';
  // Backend selector
  html += '<div class="srow"><label>Backend</label><select id="m-backend" onchange="onBackendChange()">';
  backends.forEach(function (b) {
    var label = b.name + ' (' + b.type;
    if (b.mode) label += ' ' + b.mode;
    label += ')';
    html += '<option value="' + esc(b.name) + '">' + esc(label) + '</option>';
  });
  html += '</select></div>';
  // Role
  html += '<div class="srow"><label>Role</label><select id="m-role" onchange="onBackendChange()">' +
    '<option value="chat">Chat</option><option value="embed">Embeddings</option></select></div>';
  // Dynamic fields container
  html += '<div id="m-fields"></div>';
  // Buttons
  html += '<div style="margin-top:10px;display:flex;gap:8px;">' +
    '<button class="btn btn-primary" onclick="saveModel()">Save</button>' +
    '<button class="btn" onclick="cancelModelEdit()">Cancel</button></div>';
  html += '<div class="muted" style="margin-top:6px">Fields change based on backend type. GGUF path can be a filename or full path inside models_dir.</div>';
  html += '</div>';
  // Trigger field render
  setTimeout(function () { onBackendChange(); }, 50);
  return html;
}

function onBackendChange() {
  var backendName = document.getElementById('m-backend').value;
  var role = document.getElementById('m-role').value;
  // Find backend type
  var btype = '', bmode = '';
  // We need to look up the backend type from the stored backends data
  // Store it in the option's data attribute — but we already rendered.
  // Instead, parse from the option text or store a map.
  // Simpler: store type in a global when showModels runs.
  var container = document.getElementById('m-fields');
  if (!container) return;
  // Get backend info from _modelBackends map populated by showModels
  var binfo = (_modelBackends || {})[backendName] || {};
  btype = binfo.type || '';
  bmode = binfo.mode || '';

  var html = '';
  if (role === 'embed') {
    // Embedding models: just gguf + ctx
    html += buildGgufRow(binfo);
    html += '<div class="srow"><label>Context size</label><input id="m-ctx" type="number" min="256" step="1" placeholder="4096"></div>';
  } else if (btype === 'embedded') {
    html += buildGgufRow(binfo);
    html += '<div class="srow"><label>Context size</label><input id="m-ctx" type="number" min="256" step="1" placeholder="4096"></div>';
    html += '<div class="srow"><label>GPU placement</label><select id="m-placement">' +
      '<option value="">Default (auto-detect)</option>' +
      '<option value="auto">Auto split (multi-GPU)</option>' +
      '<option value="0">Pin GPU 0</option><option value="1">Pin GPU 1</option></select></div>';
    html += '<div class="srow"><label>Workers (pool size)</label><input id="m-workers" type="number" min="1" step="1" value="1" placeholder="1"></div>';
  } else if (btype === 'llama-server' && bmode === 'remote') {
    html += '<div class="srow"><label>Remote model ID</label><input id="m-remote_id" placeholder="qwen2.5-7b-instruct" style="flex:1;min-width:260px"></div>' +
      '<div class="muted" style="margin-left:148px;margin-bottom:6px">Model name as known by the remote server.</div>';
  } else if (btype === 'llama-server') {
    // Subprocess mode
    html += buildGgufRow(binfo);
    html += '<div class="srow"><label>Context size (total)</label><input id="m-ctx" type="number" min="256" step="1" placeholder="16384"></div>';
    html += '<div class="srow"><label>GPU placement</label><select id="m-placement">' +
      '<option value="">Default (auto-detect)</option>' +
      '<option value="auto">Auto split (multi-GPU)</option>' +
      '<option value="0">Pin GPU 0</option><option value="1">Pin GPU 1</option></select></div>';
    html += '<div class="srow"><label>Parallel slots</label><input id="m-parallel" type="number" min="1" step="1" value="1" placeholder="1"></div>';
  } else if (btype === 'runpod') {
    html += '<div class="srow"><label>Endpoint ID (serverless)</label><input id="m-endpoint_id" placeholder="xc0i5r8ejntk8p" style="flex:1;min-width:260px"></div>' +
      '<div class="srow"><label>Pod ID (BYO pod)</label><input id="m-pod_id" placeholder="h8jrfftx3cq7s9" style="flex:1;min-width:260px"></div>' +
      '<div class="srow"><label>Transport</label><select id="m-transport">' +
      '<option value="openai">OpenAI shim</option><option value="runsync">RunSync (raw job)</option></select></div>' +
      '<div class="srow"><label>Timeout (s, 0 = default)</label><input id="m-timeout_s" type="number" min="0" step="1" placeholder="120"></div>' +
      '<div class="muted" style="margin-left:148px;margin-bottom:6px">Use endpoint_id for serverless, pod_id for BYO pods. Not both.</div>';
  } else if (btype === 'openai') {
    html += '<div class="srow"><label>Remote model ID</label><input id="m-remote_id" placeholder="gpt-4o-mini" style="flex:1;min-width:260px"></div>';
  } else if (btype === 'runpod-public') {
    html += '<div class="srow"><label>Model slug</label><input id="m-model_slug" placeholder="black-forest-labs/FLUX.1-schnell" style="flex:1;min-width:260px"></div>' +
      '<div class="srow"><label>Remote model ID</label><input id="m-remote_id" placeholder="(defaults to slug)" style="flex:1;min-width:260px"></div>' +
      '<div class="srow"><label>Timeout (s, 0 = default)</label><input id="m-timeout_s" type="number" min="0" step="1" placeholder="120"></div>' +
      '<div class="muted" style="margin-left:148px;margin-bottom:6px">Pre-deployed RunPod model slug. Found at runpod.io/console/serverless.</div>';
  }
  container.innerHTML = html;
}

function buildGgufRow(binfo) {
  // We don't have discovered list here — use a text input with placeholder
  return '<div class="srow"><label>GGUF file</label><input id="m-gguf" placeholder="model-name.gguf or path/to/file" style="flex:1;min-width:260px"></div>';
}

function buildConfiguredTable(configured, data) {
  var names = Object.keys(configured);
  var html = '<div class="widget"><h3>Configured models (' + names.length + ')</h3>';
  if (!names.length) {
    html += '<div class="muted">No models configured — add one above or use auto-discovery.</div>';
  } else {
    html += '<table><thead><tr><th>name</th><th>backend</th><th>role</th><th>details</th><th></th></tr></thead><tbody>';
    names.forEach(function (n) {
      var info = configured[n];
      var cfg = info.cfg || {};
      var details = [];
      if (cfg.gguf) details.push('file: ' + esc(cfg.gguf));
      if (cfg.remote_id) details.push('remote: ' + esc(cfg.remote_id));
      if (cfg.endpoint_id) details.push('ep: ' + esc(cfg.endpoint_id));
      if (cfg.pod_id) details.push('pod: ' + esc(cfg.pod_id));
      if (cfg.ctx) details.push('ctx: ' + cfg.ctx);
      if (cfg.workers && cfg.workers > 1) details.push('×' + cfg.workers + ' workers');
      if (cfg.parallel && cfg.parallel > 1) details.push('×' + cfg.parallel + ' slots');

      if (cfg.transport) details.push(cfg.transport);
      if (cfg.model_slug) details.push('slug: ' + esc(cfg.model_slug));
      if (cfg.timeout_s) details.push('timeout: ' + cfg.timeout_s + 's');

      var loaded = (data.loaded || []).find(function (m) { return m.alias === n; });
      var statusBadge = loaded ? '<span class="badge ok">loaded</span>' : '<span class="badge dim">not loaded</span>';
      html += '<tr><td><b>' + esc(n) + '</b> ' + statusBadge + '</td>' +

function buildBackendTable(defs) {
  var backends = defs.backends || [];

  if (!backends.length) {
    html += '<div class="muted">No backends configured.</div>';
  } else {
    html += '<table><thead><tr><th>name</th><th>type</th><th>mode</th><th>settings</th><th></th></tr></thead><tbody>';
    backends.forEach(function (b) {
      var settings = [];
      if (b.type === 'llama-server') {
        if (b.mode === 'remote') settings.push('url: ' + esc(b.base_url || ''));
        else settings.push('exe: ' + esc(b.server_exe || ''), 'ports ' + (b.port_base || 8120) + '+', 'idle ' + (b.idle_timeout_s || 0) + 's');
      } else if (b.type === 'runpod') {
        settings.push('key: ' + esc(b.api_key_env || ''));
      } else if (b.type === 'runpod-public') {
        settings.push('key: ' + esc(b.api_key_env || ''));
      } else if (b.type === 'openai') {
        settings.push('url: ' + esc(b.base_url || ''), 'key: ' + esc(b.api_key_env || ''));
      }
      var modelCount = Object.keys(b.models || {}).length + Object.keys(b.embedding_models || {}).length;

        actions += ' <button class="btn btn-sm" onclick="checkRunpodInventory()">🔍 inventory</button> ' +
          '<button class="btn btn-sm" onclick="showDeployPod()">+ deploy</button> ' +
          '<button class="btn btn-sm" onclick="showAddServerless()">+ serverless</button>';
      }
      html += '<tr><td><b>' + esc(b.name) + '</b> <span class="muted">(' + modelCount + ' models)</span></td>' +
        '<td><span class="badge ' + esc(b.type) + '">' + esc(b.type) + '</span></td>' +
        '<td>' + esc(b.mode || '—') + '</td>' +
        '<td class="muted">' + (settings.length ? settings.join(' · ') : '—') + '</td>' +
        '<td>' + actions + '</td></tr>';

  if (!b) { notify('✗ Backend not found', true); return; }

          '<div class="bar"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +

          fmtMB(g.free_mb) + '</b> free of ' + fmtMB(g.total_mb) + ' (' + pct + '%)</div></div>';
      });
      html += '<div class="widget"><h3>Per-model (' + esc(st.total) + ' logged requests)</h3>';
      if (!(st.per_model || []).length) html += '<div class="muted">No requests logged yet.</div>';
      else {
        html += '<table><thead><tr><th>model</th><th>backend</th><th class="num">n</th>' +
          '<th class="num">avg ms</th><th class="num">max ms</th><th class="num">tokens</th>' +
          '<th class="num">errors</th></tr></thead><tbody>';

          html += '<tr><td><b>' + esc(m.model) + '</b></td><td>' + esc(m.backend) + '</td>' +
            '<td class="num">' + m.n + '</td><td class="num">' + m.avg_ms + '</td>' +
            '<td class="num">' + m.max_ms + '</td><td class="num">' + m.total_tokens + '</td>' +
            '<td class="num">' + (m.errors ? '<span style="color:var(--danger)">' + m.errors + '</span>' : '0') + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      html += '</div><div class="widget"><h3>Recent requests</h3><table><tbody>';
      (st.recent || []).slice(-15).reverse().forEach(function (e) {
        var col = e.status >= 400 ? 'var(--danger)' : 'var(--text-dim)';
        html += '<tr><td class="muted">' + esc(e.ts) + '</td><td><b>' + esc(e.model) + '</b></td>' +
          '<td>' + esc(e.backend || '—') + '</td><td>' + (e.stream ? 'stream' : 'chat') + '</td>' +

function buildBenchmarkWidget() {
  var html = '<div class="widget"><h3>Benchmark</h3>';
  html += '<div class="srow"><label>Model</label><input id="bm-model" placeholder="model alias" style="flex:1;min-width:260px"></div>';
  html += '<div class="srow"><label>Base URL</label><input id="bm-base_url" placeholder="(empty = gateway self)" style="flex:1;min-width:260px"></div>';

  html += '<div class="srow"><label>Iterations</label><input id="bm-n" type="number" min="1" value="1" style="width:80px"></div>';

function runBenchmark() {
  var model = document.getElementById('bm-model').value.trim();
  if (!model) { notify('✗ Model is required', true); return; }
  var payload = {
    model: model,
    base_url: document.getElementById('bm-base_url').value.trim(),
    api_key: document.getElementById('bm-api_key').value,
    prompt: document.getElementById('bm-prompt').value.trim() || "Explain quantum computing in simple terms.",
    n: parseInt(document.getElementById('bm-n').value) || 1,
    max_tokens: parseInt(document.getElementById('bm-max_tokens').value) || 256,
    stream: document.getElementById('bm-stream').value === '1',
  };
  document.getElementById('bm-results').innerHTML = '<div class="loading">Running benchmark…</div>';
  api('/admin/benchmark', {method: 'POST', body: payload})
    .then(function (d) {
      var html = '';
      if (d.aggregate) {
        html += '<div class="kv"><b>Avg latency:</b> ' + d.aggregate.avg_total_ms + 'ms · ' +
          '<b>TTFT:</b> ' + d.aggregate.avg_ttft_ms + 'ms · ' +
          '<b>Tok/s:</b> ' + d.aggregate.avg_tok_per_s + '</div>';
        html += '<div class="kv muted">Range: ' + d.aggregate.min_total_ms + ' – ' + d.aggregate.max_total_ms + 'ms</div>';
      }
      if (d.results && d.results.length) {
        html += '<table style="margin-top:8px;"><thead><tr><th>#</th><th>ms</th><th>TTFT</th><th>tok/s</th><th>tokens</th></tr></thead><tbody>';
        d.results.forEach(function (r) {
          html += '<tr><td>' + r.iteration + '</td><td class="num">' + r.total_ms + '</td>' +
            '<td class="num">' + (r.ttft_ms != null ? r.ttft_ms : '—') + '</td>' +
            '<td class="num">' + (r.tok_per_s != null ? r.tok_per_s : '—') + '</td>' +
            '<td class="num">' + (r.tokens || 0) + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      document.getElementById('bm-results').innerHTML = html;
    })
    .catch(function (e) {
      document.getElementById('bm-results').innerHTML = '<div style="color:var(--danger)">✗ ' + esc(e.message) + '</div>';
    });
}

    .then(function () { notify('✓ key added'); input.value = ''; showPanel('params'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function removeGatewayKey(key) {
  if (!confirm('Remove gateway key ' + key.substring(0, 8) + '…?')) return;
  api('/admin/gateway-keys', {method: 'POST', body: {key: key, delete: true}})
    .then(function () { notify('✓ key removed'); showPanel('params'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}

// ---------- API Keys ----------
function showKeys(ui) {
  ui.title.textContent = '🔑 API Keys & Connections';
  // Fetch both secrets and backends data
  Promise.all([api('/admin/secrets'), api('/admin/backends')]).then(function (results) {
    var secrets = results[0];
    var backends = results[1];
    var html = '';
    // Gateway access section
    html += '<div class="widget"><h3>Gateway access (bearer keys)</h3>';
    html += secrets.gateway_keys_configured
      ? '<div class="kv"><span class="badge ok">secured</span> Requests need <b>Authorization: Bearer &lt;key&gt;</b></div>'
      : '<div class="kv"><span class="badge warn">open</span> No gateway_keys configured — trusts localhost. Add keys via <b>Parameters → Gateway access keys</b>.</div>';
    html += '</div>';
    // Backend service credentials
    html += '<div class="widget"><h3>Backend service credentials</h3>';
    if (!(secrets.api_keys || []).length)
      html += '<div class="muted">No cloud/runpod backends configured — nothing needs keys.</div>';
    else {
      html += '<table><thead><tr><th>Environment variable</th><th>Used by backends</th><th>Status</th></tr></thead><tbody>';
      secrets.api_keys.forEach(function (k) {
        var badge = k.source === 'env' ? '<span class="badge ok">env</span>'
          : k.source === 'keyring' ? '<span class="badge ok">keyring</span>'
          : '<span class="badge err">missing</span>';
        html += '<tr><td><code>' + esc(k.name) + '</code></td><td>' +
          k.backends.map(esc).join(', ') + '</td><td>' + badge + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div class="muted" style="margin-top:10px">' + esc(secrets.hint) + '</div></div>';
    // How to set keys
    html += '<div class="widget"><h3>Setting API keys</h3>' +
      '<div class="kv"><b>Option 1 — Environment variable</b></div>' +
      '<div class="muted">Set the env var before starting the gateway (e.g., <code>set GROQ_API_KEY=your_key</code> on Windows).</div>' +
      '<div class="kv" style="margin-top:6px;"><b>Option 2 — OS Keyring</b></div>' +
      '<div class="muted">Store in the OS keyring: service = <code>Workshop</code>, username = env var name (e.g., <code>RUNPOD_API_KEY</code>). The gateway reads from keyring at boot — restart after adding.</div>' +
      '<div class="kv" style="margin-top:6px;"><b>Option 3 — Workshop secret</b></div>' +
      '<div class="muted">Use the Workshop platform to store secrets. The gateway bridges Workshop keyring at startup.</div></div>';
    ui.body.innerHTML = html;
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}

// ---------- Health & Recovery ----------
function showHealth(ui) {
  ui.title.textContent = '🩺 Health & Recovery';
  api('/healthz').then(function (h) {
    var html = '<div class="widget"><h3>Status</h3>' +
      '<div class="kv">version <b>' + esc(h.version) + '</b> · bind <b>' + esc(h.bind) + ':' + h.port + '</b></div>' +
      '<div class="kv"><b>' + h.loaded_count + '</b> loaded instances · <b>' + h.discovered_models + '</b> GGUFs on disk</div>';
    Object.keys(h.backends || {}).forEach(function (n) {
      var b = h.backends[n];
      html += '<div class="kv">· <span class="badge ' + esc(b.type) + '">' + esc(n) + '</span> ' +
        b.configured_models + ' model(s)</div>';
    });
    html += '</div>';
    (h.gpus || []).forEach(function (g) {
      var used = g.total_mb - g.free_mb, pct = Math.round(used / g.total_mb * 100);
      var cls = pct > 90 ? 'err' : pct > 70 ? 'warn' : '';
      html += '<div class="widget"><h3>' + esc(g.name) + '</h3>' +
        '<div class="bar"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
        '<div class="kv" style="margin-top:4px;"><b>' + fmtMB(used) + '</b> used · <b>' + fmtMB(g.free_mb) + '</b> free (' + pct + '%)</div></div>';
    });
    var children = h.llama_server || [], pods = h.runpod || [];
    if (children.length) {
      html += '<div class="widget"><h3>llama-server children (' + children.length + ')</h3><table><tbody>';
      children.forEach(function (c) {
        html += '<tr><td><b>' + esc(c.backend) + ':' + esc(c.model) + '</b></td><td>' + esc(c.state) +
          '</td><td><button class="btn btn-sm btn-danger" onclick="stopChild(\'' + esc(c.backend) + '\',\'' + esc(c.model) + '\')">stop</button></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    if (pods.length) {
      html += '<div class="widget"><h3>runpod pods (' + pods.length + ')</h3><table><tbody>';
      pods.forEach(function (p) {
        html += '<tr><td><b>' + esc(p.backend) + ':' + esc(p.model) + '</b></td><td>' + esc(p.state) +
          '</td><td><button class="btn btn-sm" onclick="stopPod(\'' + esc(p.backend) + '\',\'' + esc(p.model) + '\',false)">stop</button> ' +
          '<button class="btn btn-sm btn-danger" onclick="stopPod(\'' + esc(p.backend) + '\',\'' + esc(p.model) + '\',true)">terminate</button></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<div class="widget"><h3>Recovery actions</h3><div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn" onclick="unloadAll()">⏏ Unload all embedded models</button>' +
      '<button class="btn" onclick="stopAllChildren()">■ Stop all llama-server children</button>' +
      '<button class="btn" onclick="reloadConfig()">↻ Reload config</button></div>' +
      '<div class="muted" style="margin-top:6px">Everything respawns lazily — unloading/stopping only frees resources until the next request.</div></div>';
    ui.body.innerHTML = html;
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}
function unloadAll() {
  api('/admin/unload', {method: 'POST', body: {all: true}})
    .then(function (r) { notify('✓ unloaded ' + r.unloaded); showPanel('health'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function stopAllChildren() {
  api('/admin/llama-server/stop', {method: 'POST', body: {all: true}})
    .then(function () { notify('✓ all children stopped'); showPanel('health'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}

// ---------- Aliases ----------
function showAliases(ui) {
  ui.title.textContent = '🧭 Aliases';
  api('/admin/aliases').then(function (d) {
    var html = '<div class="widget"><h3>Define alias</h3>' +
      '<div class="srow"><label>name</label><input id="al-name" placeholder="smart"></div>' +
      '<div class="srow"><label>chain (backend:model, …)</label><input id="al-chain" placeholder="local:big, groq:cloud-fast" style="flex:1;min-width:260px"></div>' +
      '<div class="srow"><label>hedge_s (0 = sequential)</label><input id="al-hedge" type="number" min="0" step="0.5" value="0"></div>' +
      '<div class="srow"><label>local_only</label><input id="al-local" type="checkbox"></div>' +
      '<button class="btn btn-primary" onclick="upsertAlias()">Upsert</button></div>' +
      '<div class="widget"><h3>Existing</h3><table><thead><tr><th>alias</th><th>chain</th><th class="num">hedge_s</th><th>local_only</th><th></th></tr></thead><tbody>';
    Object.keys(d.aliases || {}).forEach(function (n) {
      var a = d.aliases[n];
      html += '<tr><td><b>' + esc(n) + '</b></td><td>' + esc((a.chain || []).join(' → ')) + '</td>' +
        '<td class="num">' + (a.hedge_s || 0) + '</td><td>' + (a.local_only ? '✓' : '') + '</td>' +
        '<td><button class="btn btn-sm btn-danger" onclick="delAlias(\'' + esc(n) + '\')">delete</button></td></tr>';
    });
    if (!Object.keys(d.aliases || {}).length)
      html += '<tr><td colspan="5" class="muted">No aliases — requests use backend:model or bare model names.</td></tr>';
    html += '</tbody></table><div class="muted" style="margin-top:6px">Hedge: the primary answers within hedge_s or the next entry races it — first completion wins.</div></div>';
    ui.body.innerHTML = html;
  }).catch(function (e) { ui.body.innerHTML = errBox(e); });
}
function upsertAlias() {
  api('/admin/aliases', {method: 'POST', body: {
    name: document.getElementById('al-name').value,
    chain: document.getElementById('al-chain').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
    hedge_s: parseFloat(document.getElementById('al-hedge').value) || 0,
    local_only: document.getElementById('al-local').checked}})
    .then(function () { notify('✓ alias saved'); showPanel('aliases'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}
function delAlias(name) {
  api('/admin/aliases', {method: 'POST', body: {name: name, delete: true}})
    .then(function () { notify('✓ deleted'); showPanel('aliases'); })
    .catch(function (e) { notify('✗ ' + e.message, true); });
}

function errBox(e) { return '<div style="color:var(--danger);padding:12px;">✗ ' + esc(e.message) + '</div>'; }

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
boot();
</script>
</body>
</html>
